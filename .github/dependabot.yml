# Security updates remain ungrouped so fixes can be reviewed independently.
# Version-update cooldowns do not apply to security updates.
version: 2
updates:
- package-ecosystem: npm
  directories:
  - /
  - /docs/docusaurus
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
    semver-major-days: 14
  groups:
    npm-vitest:
      applies-to: version-updates
      dependency-type: development
      patterns:
      - vitest
      - "@vitest/*"
      update-types:
      - major
      - minor
      - patch
    npm-docusaurus:
      applies-to: version-updates
      patterns:
      - "@docusaurus/*"
      update-types:
      - minor
      - patch
    npm-authentication:
      applies-to: version-updates
      dependency-type: production
      patterns:
      - "@azure/msal-*"
      update-types:
      - minor
      - patch
    npm-development:
      applies-to: version-updates
      dependency-type: development
      patterns:
      - "*"
      exclude-patterns:
      - vitest
      - "@vitest/*"
      - "@docusaurus/*"
      update-types:
      - minor
      - patch
    npm-runtime:
      applies-to: version-updates
      dependency-type: production
      patterns:
      - "*"
      exclude-patterns:
      - "@azure/msal-*"
      - "@docusaurus/*"
      update-types:
      - minor
      - patch
  # Remove when eslint-plugin-jsx-a11y and eslint-plugin-react support ESLint 10.
  ignore:
  - dependency-name: "@eslint/js"
    versions:
    - ">=10"
  - dependency-name: eslint
    versions:
    - ">=10"
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - npm
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: uv
  directory: /
  schedule:
