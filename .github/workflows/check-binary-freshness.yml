# yaml-lint disable
# cspell:ignore stale

name: Binary Dependency Freshness

on:
  schedule:
    # Weekly: Mondays at 08:00 UTC (before weekly-validation 09:00)
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-binary-freshness
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  check-freshness:
    name: Check Binary Dependency Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check pinned versions against latest releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Docker base image digest freshness is monitored by Dependabot (docker ecosystem).
          # See .github/dependabot.yml for Docker monitoring config.
          $tools = @(
              @{
                  Name               = 'uv'
                  Repo               = 'astral-sh/uv'
                  ShellVariable      = 'UV_VERSION'
                  PowerShellVariable = 'UvVersion'
              }
              @{
                  Name               = 'terraform-docs'
                  Repo               = 'terraform-docs/terraform-docs'
                  ShellVariable      = 'TERRAFORM_DOCS_VERSION'
                  PowerShellVariable = 'TerraformDocsVersion'
              }
              @{
                  Name          = 'tflint'
                  Repo          = 'terraform-linters/tflint'
                  ShellVariable = 'TFLINT_VERSION'
              }
              @{
                  Name          = 'actionlint'
                  Repo          = 'rhysd/actionlint'
                  ShellVariable = 'ACTIONLINT_VERSION'
              }
              @{
                  Name          = 'golangci-lint'
                  Repo          = 'golangci/golangci-lint'
                  ShellVariable = 'GOLANGCI_LINT_VERSION'
              }
          )

          Import-Module ./scripts/security/Modules/PinnedToolVersions.psm1 -Force
          $candidateFiles = Get-PinCandidateFiles -RepoRoot $PWD

          $results = @()

          foreach ($tool in $tools) {
              $assignments = @(
                  Get-PinnedToolVersionAssignments `
                      -ShellVariable $tool.ShellVariable `
                      -PowerShellVariable $tool.PowerShellVariable `
                      -Files $candidateFiles `
                      -RepoRoot $PWD
              )
              if ($assignments.Count -eq 0) {
                  throw "No version assignments found for $($tool.Name) ($($tool.ShellVariable))"
              }

              $latestTag = gh api "repos/$($tool.Repo)/releases/latest" --jq '.tag_name' 2>$null
              if (-not $latestTag) {
                  throw "Could not fetch latest release for $($tool.Repo) — freshness check cannot produce reliable results"
              }

              $latestVersion = $latestTag -replace '^v', ''
              $freshness = Get-PinnedToolFreshness -Assignments $assignments -LatestVersion $latestVersion

              $results += [ordered]@{
                  Name           = $tool.Name
                  Repo           = $tool.Repo
                  PinnedVersions = $freshness.PinnedVersions
                  LatestVersion  = $latestVersion
                  LatestTag      = $latestTag
                  IsStale        = $freshness.IsStale
                  IsInconsistent = $freshness.IsInconsistent
                  Assignments    = $assignments
              }

              $status = if ($freshness.IsStale) { '⚠️' } else { '✅' }
              $extra = if ($freshness.IsInconsistent) { ' [INCONSISTENT]' } else { '' }
              Write-Host "$status $($tool.Name): pinned=$($freshness.PinnedVersions -join ', ') latest=$latestVersion$extra"
          }

          $staleCount = @($results | Where-Object { $_.IsStale }).Count
          Write-Host "`nStale: $staleCount / $($results.Count)"

          "stale-count=$staleCount" >> $env:GITHUB_OUTPUT
          "total-count=$($results.Count)" >> $env:GITHUB_OUTPUT
          $results | ConvertTo-Json -Depth 5 | Set-Content 'freshness-results.json'

      - name: Create or update tracking issue
        if: steps.check.outputs.stale-count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_COUNT: ${{ steps.check.outputs.stale-count }}
        run: |
          $results = @(Get-Content 'freshness-results.json' | ConvertFrom-Json)

          $tableRows = foreach ($r in $results) {
              $status = if ($r.IsStale) { '⚠️ Update available' } else { '✅ Current' }
              $latest = "[$($r.LatestVersion)](https://github.com/$($r.Repo)/releases/tag/$($r.LatestTag))"
              "| $($r.Name) | $($r.PinnedVersions -join ', ') | $latest | $status |"
          }

          $staleTools = @($results | Where-Object { $_.IsStale })
          $fileLines = foreach ($r in $staleTools) {
              foreach ($pin in $r.Assignments) {
                  if ($pin.Version -ne $r.LatestVersion) {
                      "- ``$($pin.File)`` — $($r.Name) $($pin.Version) → $($r.LatestVersion)"
                  }
              }
          }

          $warnings = @($results | Where-Object { $_.IsInconsistent }) | ForEach-Object {
              $assignments = $_.Assignments | ForEach-Object { "$($_.File)=$($_.Version)" }
              "- **$($_.Name)**: version mismatch across files ($($assignments -join ', '))"
          }
          $warningSection = if ($warnings) {
              "`n### ⚠️ Version Inconsistencies`n`n$($warnings -join "`n")"
          } else { '' }

          $marker = '<!-- automation:binary-freshness -->'
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $checkDate = Get-Date -Format 'yyyy-MM-dd' -AsUTC

          $body = @"
          ## Binary Dependency Freshness Report

          | Tool | Pinned Version(s) | Latest | Status |
          |------|--------|--------|--------|
          $($tableRows -join "`n")

          ### Files Requiring Updates

          $($fileLines -join "`n")
          $warningSection

          ### Update Instructions

          Each pinned binary requires:
          1. Align every assignment to one version
          2. Download the new release asset and compute its SHA256 hash
          3. Update each co-located hash with its version assignment
          4. For multi-architecture tools (uv, terraform-docs): update all architecture variants

          ---
          **Workflow Run:** $runUrl
          **Detection Date:** $checkDate

          $marker
          "@

          $existing = gh issue list `
              --search "in:body automation:binary-freshness is:open" `
              --limit 1 `
              --json number `
              --jq '.[0].number // empty'
          $existing = if ($existing) { $existing.Trim() } else { $null }

          $title = "security: binary dependency updates available ($env:STALE_COUNT stale)"

          if ($existing) {
              Write-Host "Updating existing issue #$existing"
              gh issue edit $existing --title $title --body $body
              gh issue comment $existing `
                  --body "🔄 Weekly scan: $env:STALE_COUNT tool(s) stale as of $checkDate. [Workflow run]($runUrl)."
          } else {
              Write-Host "Creating new tracking issue"
              gh issue create `
                  --title $title `
                  --body $body `
                  --label "dependencies,automated,needs-triage"
          }

      - name: Close resolved tracking issue
        if: steps.check.outputs.stale-count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh issue list `
              --search "in:body automation:binary-freshness is:open" `
              --limit 1 `
              --json number `
              --jq '.[0].number // empty'
          $existing = if ($existing) { $existing.Trim() } else { $null }

          if ($existing) {
              $checkDate = Get-Date -Format 'yyyy-MM-dd' -AsUTC
              Write-Host "All tools current — closing issue #$existing"
              gh issue close $existing `
                  --comment "✅ All binary dependencies are current as of $checkDate."
          } else {
              Write-Host "All tools current, no open tracking issue."
          }

      - name: Write job summary
        if: always()
        run: |
          if (-not (Test-Path 'freshness-results.json')) {
              "## Binary Dependency Freshness`n`n⚠️ Check did not complete." >> $env:GITHUB_STEP_SUMMARY
              return
          }

          $results = @(Get-Content 'freshness-results.json' | ConvertFrom-Json)

          $rows = foreach ($r in $results) {
              $status = if ($r.IsStale) { '⚠️ Stale' } else { '✅ Current' }
              "| $($r.Name) | $($r.PinnedVersions -join ', ') | $($r.LatestVersion) | $status |"
          }

          $staleCount = @($results | Where-Object { $_.IsStale }).Count

          $summary = @"
          ## Binary Dependency Freshness

          | Tool | Pinned Version(s) | Latest | Status |
          |------|--------|--------|--------|
          $($rows -join "`n")

          **Stale:** $staleCount / $($results.Count)
          "@

          $summary >> $env:GITHUB_STEP_SUMMARY
