name: Binary Integrity Check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-hashes:
    name: Check Pinned Binary Hashes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify pinned hashes
        shell: pwsh
        run: ./scripts/security/Test-BinaryFreshness.ps1 -SarifFile binary-freshness-results.sarif

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: binary-freshness-results.sarif
          category: binary-freshness
        continue-on-error: true
