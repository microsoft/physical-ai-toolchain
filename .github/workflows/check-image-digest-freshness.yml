name: Container Image Digest Freshness

on:
  schedule:
    # Weekly: Mondays at 07:30 UTC, before the other dependency freshness checks.
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-image-digest-freshness
  cancel-in-progress: false

jobs:
  check-freshness:
    name: Check Container Image Digest Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check pinned digests against registry tags
        run: |
          rm -f logs/image-digest-freshness.sarif
          status=0
          ./scripts/update-image-digests.sh \
            --check \
            --sarif-output logs/image-digest-freshness.sarif || status=$?

          if [[ "$status" -ne 0 && "$status" -ne 2 ]]; then
            exit "$status"
          fi
          # Exit 2 means drift was reported through SARIF and remains non-gating.
          if [[ "$status" -eq 2 ]]; then
            echo "::warning::Image digest or AzureML environment drift detected; review the uploaded SARIF findings."
          fi

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('logs/image-digest-freshness.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: logs/image-digest-freshness.sarif
          category: container-image-digest-freshness
