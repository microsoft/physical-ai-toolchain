name: Convert root package lock

on:
  push:
    branches:
      - algattik-microsoft-1722-canonical-public-locks

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out conversion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: algattik-microsoft-1722-canonical-public-locks
          fetch-depth: 0

      - name: Convert package lock
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          python .github/scripts/convert-package-lock.py package-lock.json

      - name: Verify lock invariants
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          before_text = Path("/tmp/package-lock.before.json").read_text()
          after_text = Path("package-lock.json").read_text()
          before = json.loads(before_text)
          after = json.loads(after_text)

          def normalize(value):
              if isinstance(value, dict):
                  return {
                      key: normalize(item)
                      for key, item in value.items()
                      if key not in {"resolved", "integrity"}
                  }
              if isinstance(value, list):
                  return [normalize(item) for item in value]
              return value

          if normalize(before) != normalize(after):
              raise SystemExit("package-lock.json changed outside resolved and integrity fields")
          if list(before["packages"]) != list(after["packages"]):
              raise SystemExit("package ordering changed")
          if re.search(r"packagefeedproxy\.microsoft\.io|pkgs\.visualstudio\.com|ms-feed-", after_text):
              raise SystemExit("private npm mirror host remains")
          if re.search(r'"integrity"\s*:\s*"sha1-', after_text):
              raise SystemExit("SHA-1 integrity remains")
          PY
          git diff --exit-code -- . ':!package-lock.json'
          git diff --check

      - name: Commit converted lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit \
            -m "build(build): canonicalize root npm lock metadata" \
            -m "📦 - Generated by Copilot" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:algattik-microsoft-1722-canonical-public-locks
