# Copilot Setup Steps
# Provisions the toolchain and per-surface dependency closures for GitHub
# Copilot cloud coding agent sessions. The single `copilot-setup-steps` job
# is consumed by Copilot before each agent session; this workflow also runs
# on self-changes and weekly to detect toolchain drift.
#
# Reference:
# https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment
---
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  # Weekly drift check: surfaces broken action SHAs, yanked packages, or
  # registry outages on a Monday morning instead of mid-Copilot-session.
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install apt packages (shellcheck, jq, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq ffmpeg

      - name: Install actionlint
        run: scripts/setup/install-actionlint.sh

      - name: Install OSV-Scanner v2.3.8
        env:
          OSV_SCANNER_VERSION: 2.3.8
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl -sSLo /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c --quiet -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          rm -f /tmp/osv-scanner
          osv-scanner --version

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Setup Node.js (frontend pin)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: data-management/viewer/frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            data-management/viewer/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: infrastructure/terraform/e2e/go.mod
          cache-dependency-path: infrastructure/terraform/e2e/go.mod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0

      - name: Install gh-aw CLI extension (v0.81.6)
        run: gh extension install github/gh-aw --pin v0.81.6
        env:
          GH_TOKEN: ${{ github.token }}

      # Bootstrap the microsoft/hve-core RPI skills for the cloud agent. This
      # step runs outside the cloud-agent firewall (per the
      # customize-the-agent-firewall docs) so it can fetch content that the
      # agent itself cannot reach.
      #
      # UPSTREAM_REF is pinned to the reviewed skill-consolidation commit because
      # no published hve-core release contains this skill layout. Prefer a release
      # SHA on future upgrades; otherwise review the commit and complete tree.
      - name: Bootstrap hve-core RPI skills
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: microsoft/hve-core
          UPSTREAM_REF: 130ab64338bb77e912e603693672c31f14bc60c6
          UPSTREAM_SKILLS_PATH: .github/skills/rpi
          DEST_DIR: .github/skills/rpi
        run: |
          set -euo pipefail

          if [ -d "${DEST_DIR}" ]; then
            find "${DEST_DIR}" -depth -mindepth 1 -delete
          fi
          mkdir -p "${DEST_DIR}"

          if ! sha="$(gh api "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_REF}" --jq .sha)" || [ -z "${sha}" ]; then
            echo "Failed to resolve ${UPSTREAM_REPO}@${UPSTREAM_REF} SHA" >&2
            exit 1
          fi

          echo "Resolved ${UPSTREAM_REPO}@${UPSTREAM_REF} -> ${sha}"

          if ! tree_json="$(gh api "repos/${UPSTREAM_REPO}/git/trees/${sha}?recursive=1")"; then
            echo "Failed to read ${UPSTREAM_REPO}@${sha} tree" >&2
            exit 1
          fi

          if jq -e '.truncated == true' <<<"${tree_json}" >/dev/null; then
            echo "Git tree response was truncated for ${UPSTREAM_REPO}@${sha}" >&2
            exit 1
          fi

          mapfile -t unsupported_files < <(
            jq -r --arg prefix "${UPSTREAM_SKILLS_PATH}/" \
              '.tree[]
              | select(.type == "blob")
              | select(.path | startswith($prefix))
              | select(.mode != "100644" and .mode != "100755")
              | .path' <<<"${tree_json}"
          )
          if [ "${#unsupported_files[@]}" -gt 0 ]; then
            printf 'Unsupported RPI skill file mode: %s\n' "${unsupported_files[@]}" >&2
            exit 1
          fi

          mapfile -t skill_files < <(
            jq -r --arg prefix "${UPSTREAM_SKILLS_PATH}/" \
              '.tree[]
              | select(.type == "blob")
              | select(.mode == "100644" or .mode == "100755")
              | select(.path | startswith($prefix))
              | .path' <<<"${tree_json}"
          )

          if [ "${#skill_files[@]}" -eq 0 ]; then
            echo "No RPI skill files discovered under ${UPSTREAM_REPO}@${sha}:${UPSTREAM_SKILLS_PATH}" >&2
            exit 1
          fi

          declare -A discovered_files=()
          for path in "${skill_files[@]}"; do
            discovered_files["${path}"]=1
          done

          required_skills=(rpi-quick rpi-research rpi-plan rpi-implement rpi-review)
          missing_skills=()
          for skill in "${required_skills[@]}"; do
            required_path="${UPSTREAM_SKILLS_PATH}/${skill}/SKILL.md"
            if [ -z "${discovered_files[${required_path}]:-}" ]; then
              missing_skills+=("${skill}")
            fi
          done
          if [ "${#missing_skills[@]}" -gt 0 ]; then
            printf 'Missing required RPI skill: %s\n' "${missing_skills[@]}" >&2
            exit 1
          fi

          for path in "${skill_files[@]}"; do
            relative_path="${path#"${UPSTREAM_SKILLS_PATH}/"}"
            case "${relative_path}" in
              '' | /* | ../* | */../* | */..)
                echo "Unsafe RPI skill path: ${path}" >&2
                exit 1
                ;;
            esac
            destination="${DEST_DIR}/${relative_path}"
            mkdir -p "$(dirname "${destination}")"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              "https://raw.githubusercontent.com/${UPSTREAM_REPO}/${sha}/${path}" \
              --output "${destination}"
          done

          files_json="$(printf '%s\n' "${skill_files[@]}" | jq -R . | jq -s .)"
          jq -n \
            --arg upstream_repo "${UPSTREAM_REPO}" \
            --arg requested_ref "${UPSTREAM_REF}" \
            --arg resolved_sha "${sha}" \
            --arg resolved_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson files "${files_json}" \
            '{
              upstream_repo: $upstream_repo,
              requested_ref: $requested_ref,
              resolved_sha: $resolved_sha,
              resolved_at: $resolved_at,
              files: $files
            }' > "${DEST_DIR}/_audit.json"

          echo "Installed ${#required_skills[@]} required RPI skills and ${#skill_files[@]} files from ${UPSTREAM_REPO}@${sha}"

      - name: Install PowerShell modules (Pester 5.7.1, powershell-yaml 0.4.12)
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Install root Node tooling (markdownlint, cspell, table-formatter, link-check)
        run: npm ci

      - name: Presync root Python dev group
        run: uv sync --group dev

      - name: Presync dataviewer backend Python (dev + analysis + hdf5 + export + auth)
        working-directory: data-management/viewer/backend
        run: uv sync --extra dev --extra analysis --extra hdf5 --extra export --extra auth

      - name: Presync evaluation Python dev group
        working-directory: evaluation
        run: uv sync --only-group dev

      - name: Presync dataviewer frontend
        working-directory: data-management/viewer/frontend
        run: npm ci

      - name: Presync Go modules (terraform e2e)
        working-directory: infrastructure/terraform/e2e
        run: go mod download
