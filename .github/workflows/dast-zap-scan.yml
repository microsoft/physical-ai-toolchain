name: DAST ZAP Baseline Scan

on:
  schedule:
    # Weekly scan: Sundays at 05:00 UTC (after Scorecard 03:00, Gitleaks 04:00)
    - cron: "0 5 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "data-management/viewer/frontend/**"
      - "data-management/viewer/docker-compose.yml"
      - "data-management/viewer/backend/Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dast-zap-scan.yml"
      - ".zap/rules.tsv"
      - "scripts/security/Test-DataviewerSecurityHeaders.ps1"
      - "scripts/tests/security/Test-DataviewerSecurityHeaders.Tests.ps1"

permissions:
  contents: read

jobs:
  scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    env:
      # DAST does not provision detection weights; model loading remains fail-closed.
      DETECTION_MODEL_DIGESTS: "{}"
    permissions:
      contents: read
      security-events: write
      issues: write
    concurrency:
      group: dast-zap-scan
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1

      - name: Verify security policy against hardcoded expectations
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'scripts/tests/security/Test-DataviewerSecurityHeaders.Tests.ps1'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: data-management/viewer/frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chrome
        working-directory: data-management/viewer/frontend
        run: npx playwright install --with-deps chrome

      - name: Build and start dataviewer
        shell: bash
        working-directory: data-management/viewer
        env:
          DATAVIEWER_HOST_DATA_DIR: ./data/test-dataset
        run: |
          mkdir -p "$DATAVIEWER_HOST_DATA_DIR"
          DATAVIEWER_UID="$(id -u)" DATAVIEWER_GID="$(id -g)" docker compose up -d --build --wait

      - name: Verify containers are healthy
        run: |
          $response = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "Backend health check failed" }
          $response = Invoke-WebRequest -Uri "http://localhost:5173/" -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "Frontend health check failed" }

      - name: Verify frontend security headers
        run: ./scripts/security/Test-DataviewerSecurityHeaders.ps1

      - name: Verify production MSAL redirect bridge
        run: npm run test:auth --workspace robotic-training-data-tool

      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataviewer-auth-browser-results
          path: artifacts/auth/current/playwright
          retention-days: 14

      - name: ZAP baseline scan
        if: github.event_name != 'pull_request'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:5173/"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: true
          issue_title: "DAST ZAP Baseline Scan Report"
          fail_action: false
          artifact_name: "zap-baseline-report"

      - name: Convert ZAP report to SARIF
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 scripts/security/zap-to-sarif.py report_json.json results/zap-results.sarif

      - name: Upload SARIF to Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results/zap-results.sarif
          category: dast-zap-baseline
          wait-for-processing: true

      - name: Upload scan results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dast-zap-results
          path: |
            report_json.json
            report_md.md
            report_html.html
            results/zap-results.sarif
          retention-days: 90

      - name: Stop dataviewer containers
        if: always()
        shell: bash
        working-directory: data-management/viewer
        run: docker compose down

      - name: Add job summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## DAST ZAP Baseline Scan Results

          | Metric | Value |
          |--------|-------|
          | Target | \`http://localhost:5173/\` |
          | Status | ${JOB_STATUS} |
          | Security Tab | [View alerts](/${{ github.repository }}/security/code-scanning?query=tool%3Azap) |
          | Artifacts | [View run artifacts](/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          EOF
