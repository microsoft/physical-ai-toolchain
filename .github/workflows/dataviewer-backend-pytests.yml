name: Dataviewer Backend Pytest

on:
  workflow_call:
    inputs:
      code-coverage:
        description: 'Enable Codecov coverage upload'
        required: false
        default: false
        type: boolean
    outputs:
      work-status:
        value: ${{ jobs.pytest-dataviewer.outputs.work-status }}
      expected-count:
        value: ${{ jobs.pytest-dataviewer.outputs.expected-count }}
      executed-count:
        value: ${{ jobs.pytest-dataviewer.outputs.executed-count }}
      artifact-id:
        value: ${{ jobs.pytest-dataviewer.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.pytest-dataviewer.outputs.artifact-url }}
      test-count:
        value: ${{ jobs.pytest-dataviewer.outputs.test-count }}
      skipped-count:
        value: ${{ jobs.pytest-dataviewer.outputs.skipped-count }}
      first-failure:
        value: ${{ jobs.pytest-dataviewer.outputs.first-failure }}

permissions:
  contents: read

jobs:
  pytest-dataviewer:
    name: Pytest Dataviewer Backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    defaults:
      run:
        working-directory: data-management/viewer/backend
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.20'
          checksum: '6590717592ace991ff83a63fef799e3ad9d33ecc8f96c5d6bdd732496e79337f'

      - name: Install system dependencies
        id: system-dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        id: install
        run: uv sync --project ../../.. --all-packages --frozen --group dev --extra analysis --extra hdf5 --extra export --extra auth --extra azure --extra api --extra openai --extra qwen3-vl

      - name: Run pytest with coverage
        id: test
        run: >-
          uv run --project ../../.. --all-packages --no-sync --frozen pytest -v
          --junitxml=../../../logs/pytest-dataviewer-results.xml
          --cov=src --cov=evaluation.vlm_judge
          --cov-report= --cov-fail-under=0

      - name: Generate scoped coverage reports
        id: coverage_generate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ../../../logs
          rm -f ../../../logs/coverage-dataviewer.xml
          rm -f ../../../logs/coverage-vlm-judge-backend.xml

          if [ ! -s .coverage ]; then
            echo "::warning::Coverage data is unavailable; scoped reports cannot be generated."
            exit 1
          fi

          set +e
          uv run --project ../../.. --all-packages --no-sync coverage xml \
            --include='*/backend/src/*' --fail-under=0 \
            -o ../../../logs/coverage-dataviewer.xml
          backend_status=$?

          uv run --project ../../.. --all-packages --no-sync coverage xml \
            --include='*/evaluation/vlm_judge/*' --omit='*/__init__.py' \
            --fail-under=0 -o ../../../logs/coverage-vlm-judge-backend.xml
          judge_status=$?
          set -e

          if [ "$backend_status" -ne 0 ] || [ "$judge_status" -ne 0 ]; then
            echo "::warning::One or more scoped coverage reports could not be generated."
            exit 1
          fi

      - name: Validate scoped coverage reports
        id: coverage_validate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = {
              "backend_valid": Path("../../../logs/coverage-dataviewer.xml"),
              "judge_backend_valid": Path("../../../logs/coverage-vlm-judge-backend.xml"),
          }

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, path in reports.items():
                  valid = False
                  try:
                      root = ET.parse(path).getroot()
                      valid = (
                          root.tag == "coverage"
                          and int(root.attrib.get("lines-valid", "0")) > 0
                          and 0.0 <= float(root.attrib.get("line-rate", "")) <= 1.0
                      )
                  except (OSError, ET.ParseError, ValueError):
                      pass

                  print(f"{name}={'true' if valid else 'false'}", file=output)
                  if not valid:
                      print(f"::warning::Coverage report unavailable or invalid: {path}")
          PY

      - name: Enforce backend coverage threshold
        id: backend_coverage_gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail

          if [ "${{ steps.coverage_validate.outputs.backend_valid }}" != "true" ]; then
            echo "::error::Dataviewer backend coverage report is missing or invalid."
            exit 1
          fi

          uv run --project ../../.. --all-packages --no-sync coverage report \
            --include='*/backend/src/*' --fail-under=90

      - name: Enforce judge backend coverage threshold
        id: judge_backend_coverage_gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail

          if [ "${{ steps.coverage_validate.outputs.judge_backend_valid }}" != "true" ]; then
            echo "::error::Judge backend coverage report is missing or invalid."
            exit 1
          fi

          uv run --project ../../.. --all-packages --no-sync coverage report \
            --include='*/evaluation/vlm_judge/*' --omit='*/__init__.py' --fail-under=70

      - name: Run product-owned judge unit tests
        id: judge_unit
        run: |
          uv run --project ../../.. --all-packages --no-sync --frozen pytest -v -c ../../../evaluation/vlm_judge/pyproject.toml ../../../evaluation/tests/vlm_judge --junitxml=../../../logs/pytest-vlm-judge-results.xml --cov-report=xml:../../../logs/coverage-vlm-judge.xml --cov-fail-under=35
          test -s ../../../logs/coverage-vlm-judge.xml

      - name: Validate coverage report
        id: coverage_report
        if: ${{ success() && inputs.code-coverage }}
        run: |
          test -s ../../../logs/coverage-dataviewer.xml
          test -s ../../../logs/coverage-vlm-judge-backend.xml
          test -s ../../../logs/coverage-vlm-judge.xml

      - name: Upload coverage.xml artifact
        id: coverage_upload
        if: ${{ inputs.code-coverage && always() }}
        continue-on-error: ${{ job.status == 'failure' || steps.test.outcome != 'success' || steps.coverage_report.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-dataviewer-coverage-xml
          path: |
            logs/coverage-dataviewer.xml
            logs/coverage-vlm-judge-backend.xml
            logs/coverage-vlm-judge.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage to Codecov
        if: ${{ inputs.code-coverage && always() && steps.coverage_validate.outputs.backend_valid == 'true' }}
        continue-on-error: ${{ job.status == 'failure' || steps.test.outcome != 'success' || steps.coverage_report.outcome == 'failure' || steps.coverage_upload.outcome == 'failure' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          files: logs/coverage-dataviewer.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest-dataviewer
          name: pytest-dataviewer-coverage

      - name: Upload judge coverage to Codecov
        if: ${{ inputs.code-coverage && always() && steps.coverage_validate.outputs.judge_backend_valid == 'true' }}
        continue-on-error: ${{ job.status == 'failure' || steps.test.outcome != 'success' || steps.coverage_report.outcome == 'failure' || steps.coverage_upload.outcome == 'failure' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          files: logs/coverage-vlm-judge-backend.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest-vlm-judge
          name: pytest-vlm-judge-backend-coverage

      - name: Upload judge unit coverage to Codecov
        if: ${{ inputs.code-coverage && always() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: logs/coverage-vlm-judge.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
          flags: pytest-vlm-judge
          name: pytest-vlm-judge-unit-coverage

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: dataviewer-backend-pytests
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["system-dependencies","install","test","judge_unit","backend_coverage_gate","judge_backend_coverage_gate"]'
          reports: '[{"path":"logs/pytest-dataviewer-results.xml","kind":"junit"},{"path":"logs/pytest-vlm-judge-results.xml","kind":"junit"}]'
