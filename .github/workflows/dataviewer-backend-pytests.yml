name: Dataviewer Backend Pytest

on:
  workflow_call:
    inputs:
      code-coverage:
        description: 'Enable Codecov coverage upload'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pytest-dataviewer:
    name: Pytest Dataviewer Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-management/viewer/backend
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --extra dev --extra analysis --extra hdf5 --extra export --extra auth

      - name: Run pytest with coverage
        run: uv run --with-editable ../../../evaluation/vlm_judge pytest -v --cov=src --cov-report=xml:../../../logs/coverage-dataviewer.xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage.xml artifact
        if: ${{ inputs.code-coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-dataviewer-coverage-xml
          path: logs/coverage-dataviewer.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        if: ${{ inputs.code-coverage && always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: logs/coverage-dataviewer.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest-dataviewer
          name: pytest-dataviewer-coverage
