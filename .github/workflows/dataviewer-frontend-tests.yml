name: Dataviewer Frontend Tests

on:
  workflow_call:
    inputs:
      code-coverage:
        description: 'Enable Codecov coverage upload'
        required: false
        default: false
        type: boolean
    outputs:
      work-status:
        value: ${{ jobs.frontend-checks.outputs.work-status }}
      expected-count:
        value: ${{ jobs.frontend-checks.outputs.expected-count }}
      executed-count:
        value: ${{ jobs.frontend-checks.outputs.executed-count }}
      artifact-id:
        value: ${{ jobs.frontend-checks.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.frontend-checks.outputs.artifact-url }}
      test-count:
        value: ${{ jobs.frontend-checks.outputs.test-count }}
      skipped-count:
        value: ${{ jobs.frontend-checks.outputs.skipped-count }}
      first-failure:
        value: ${{ jobs.frontend-checks.outputs.first-failure }}

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Lint, Type-check, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    defaults:
      run:
        working-directory: data-management/viewer/frontend
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: data-management/viewer/frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install
        working-directory: .
        run: npm ci

      - name: ESLint
        id: lint
        run: npm run lint

      - name: Type check
        id: type-check
        run: npm run type-check

      - name: Format check
        id: format
        run: npm run format

      - name: Unit tests
        id: test
        env:
          CODE_COVERAGE: ${{ inputs.code-coverage }}
        run: |
          if [[ "$CODE_COVERAGE" == "true" ]]; then
            npm run test:coverage -- --outputFile.junit=../../../logs/dataviewer-frontend-results.xml
          else
            npm run test -- --outputFile.junit=../../../logs/dataviewer-frontend-results.xml
          fi

      - name: Build
        id: build
        run: npm run build

      - name: Upload coverage artifact
        if: ${{ inputs.code-coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage-xml
          path: data-management/viewer/frontend/coverage/cobertura-coverage.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        if: ${{ inputs.code-coverage && always() }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: data-management/viewer/frontend/coverage/cobertura-coverage.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: vitest,vitest-components,vitest-features,vitest-lib,vitest-state,vitest-app
          name: vitest-coverage

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: dataviewer-frontend-tests
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["install","lint","type-check","format","test","build"]'
          reports: '[{"path":"logs/dataviewer-frontend-results.xml","kind":"junit"}]'
