name: Dependency Review

on:
  workflow_call:
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.dependency-review.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.dependency-review.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.dependency-review.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.dependency-review.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.dependency-review.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.dependency-review.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.dependency-review.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.dependency-review.outputs.first-failure }}'}

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # GHSA-wf7f-8fxf-xfxc: mlflow — unsafe deserialization of malicious PyTorch models; no upstream fix; server-side/model-loading only (CVE-2024-37059)
          # GHSA-pgqp-8h46-6x4j: mlflow — DNS rebinding via missing Origin header validation; fixed in 3.5.0; azureml-mlflow constrains mlflow<3.0.0 (CVE-2025-14279)
          # GHSA-4x5p-f36r-mxxr: mlflow — world-writable temp dir enables race-condition RCE; fixed in 3.4.0; azureml-mlflow constrains mlflow<3.0.0 (CVE-2025-10279)
          # GHSA-hqmj-h5c6-369m: onnx — hub.load() suppresses trust warnings; no fix released; repo uses onnx for model serialization only (CVE-2026-28500)
          # GHSA-7qhf-v65m-g5f3: mlflow — unauthenticated FastAPI job endpoints under /ajax-api/3.0/jobs/*; no upstream fix; server-side only (CVE-2026-0545)
          # GHSA-46r5-x6jq-v8g6: mlflow — AJAX artifact download authorization bypass; no upstream fix; server-side only, repo uses client only (CVE-2026-33866)
          # GHSA-fh64-r2vc-xvhr: mlflow — stored XSS via YAML MLmodel artifacts; fixed in 3.11.1; blocked by azureml-mlflow<=3.9.0 ceiling; server-side only (CVE-2026-33865)
          # GHSA-h35f-9h28-mq5c: setuptools — macOS Unicode normalization bypass when publishing sdists; runtime lock installs wheels on Linux and never publishes packages
          allow-ghsas: >-
            GHSA-wf7f-8fxf-xfxc,
            GHSA-pgqp-8h46-6x4j,
            GHSA-4x5p-f36r-mxxr,
            GHSA-hqmj-h5c6-369m,
            GHSA-7qhf-v65m-g5f3,
            GHSA-46r5-x6jq-v8g6,
            GHSA-fh64-r2vc-xvhr,
            GHSA-h35f-9h28-mq5c

      # GHSA-xrqw-3rrv-vx5w affects transformers<5.10.0, while LeRobot 0.6.1
      # constrains the SO-101 lock below 5.6.0. The example does not save
      # attacker-supplied tokenizers or processors.
      # Exception owner: @microsoft/edge-ai-core-dev.
      # Remove after adopting a LeRobot release compatible with transformers>=5.10.0
      # and regenerating the SO-101 uv.lock with the patched transformers release.
      - name: Enforce path-scoped vulnerability exceptions
        id: review
        if: always()
        env:
          DEPENDENCY_REVIEW_OUTCOME: ${{ steps.dependency-review.outcome }}
          VULNERABLE_CHANGES: ${{ steps.dependency-review.outputs.vulnerable-changes }}
          INVALID_LICENSE_CHANGES: ${{ steps.dependency-review.outputs.invalid-license-changes }}
          DENIED_CHANGES: ${{ steps.dependency-review.outputs.denied-changes }}
          SCOPED_GHSA: GHSA-xrqw-3rrv-vx5w
          SCOPED_MANIFEST: gpu-offload/examples/so101-real-hardware/uv.lock
          SCOPED_PACKAGE: transformers
        shell: bash
        run: |
          set -o errexit -o nounset -o pipefail
          case "$DEPENDENCY_REVIEW_OUTCOME" in
            success|failure) ;;
            *) echo "::error::Dependency review did not complete"; exit 1 ;;
          esac
          python3 scripts/security/check_dependency_review_exception.py

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: dependency-review
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["review"]'
