name: Docusaurus Tests

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on test failures'
        required: false
        type: boolean
        default: false
    outputs:
      work-status:
        value: ${{ jobs.docusaurus.outputs.work-status }}
      expected-count:
        value: ${{ jobs.docusaurus.outputs.expected-count }}
      executed-count:
        value: ${{ jobs.docusaurus.outputs.executed-count }}
      artifact-id:
        value: ${{ jobs.docusaurus.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.docusaurus.outputs.artifact-url }}
      test-count:
        value: ${{ jobs.docusaurus.outputs.test-count }}
      skipped-count:
        value: ${{ jobs.docusaurus.outputs.skipped-count }}
      first-failure:
        value: ${{ jobs.docusaurus.outputs.first-failure }}

permissions:
  contents: read

jobs:
  docusaurus:
    name: Docusaurus Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    defaults:
      run:
        working-directory: docs/docusaurus
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: docs/docusaurus/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci && mkdir -p test-results

      - name: Type check
        id: type-check
        run: npm run typecheck

      - name: Build documentation
        id: build
        run: npm run build

      - name: Run Jest tests
        id: jest
        run: npx --no-install jest --json --outputFile=test-results/docusaurus-jest.json
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Run Mermaid validator tests
        id: node-test
        run: >-
          node --test --test-reporter=junit
          --test-reporter-destination=test-results/docusaurus-node.xml
          scripts/validate-mermaid-accessibility.test.mjs
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Validate Mermaid accessibility
        id: mermaid
        run: node scripts/validate-mermaid-accessibility.mjs
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: docusaurus-tests
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["install","type-check","build","jest","node-test","mermaid"]'
          reports: >-
            [{"path":"docs/docusaurus/test-results/docusaurus-jest.json","kind":"jest"},
            {"path":"docs/docusaurus/test-results/docusaurus-node.xml","kind":"junit"}]
          fail-on-error: ${{ !inputs.soft-fail }}
