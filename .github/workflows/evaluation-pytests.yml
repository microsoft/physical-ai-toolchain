name: Evaluation Pytest Tests

on:
  workflow_call:
    inputs:
      code-coverage:
        description: 'Enable Codecov coverage upload'
        required: false
        default: false
        type: boolean
    outputs:
      work-status:
        value: ${{ jobs.pytest.outputs.work-status }}
      expected-count:
        value: ${{ jobs.pytest.outputs.expected-count }}
      executed-count:
        value: ${{ jobs.pytest.outputs.executed-count }}
      artifact-id:
        value: ${{ jobs.pytest.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.pytest.outputs.artifact-url }}
      test-count:
        value: ${{ jobs.pytest.outputs.test-count }}
      skipped-count:
        value: ${{ jobs.pytest.outputs.skipped-count }}
      first-failure:
        value: ${{ jobs.pytest.outputs.first-failure }}

permissions:
  contents: read

jobs:
  pytest:
    name: Evaluation Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    defaults:
      run:
        working-directory: evaluation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dependencies
        id: install
        run: uv sync --only-group dev

      - name: Run pytest
        id: test
        run: uv run --only-group dev pytest -v --junitxml=logs/evaluation-pytest-results.xml

      - name: Upload coverage.xml artifact
        if: ${{ inputs.code-coverage && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-pytest-coverage-xml
          path: evaluation/logs/coverage.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        if: ${{ inputs.code-coverage && !cancelled() }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: evaluation/logs/coverage.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest-evaluation
          name: evaluation-pytest-coverage

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: evaluation-pytests
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["install","test"]'
          reports: '[{"path":"evaluation/logs/evaluation-pytest-results.xml","kind":"junit"}]'
