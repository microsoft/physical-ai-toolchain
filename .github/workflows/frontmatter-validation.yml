name: Frontmatter Validation

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on frontmatter validation errors'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only validate changed markdown files'
        required: false
        type: boolean
        default: true
      warnings-as-errors:
        description: 'Treat warnings as errors'
        required: false
        type: boolean
        default: true
      enable-schema-validation:
        description: 'Enable JSON schema validation against schema definitions'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.frontmatter-validation.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.frontmatter-validation.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.frontmatter-validation.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.frontmatter-validation.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.frontmatter-validation.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.frontmatter-validation.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.frontmatter-validation.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.frontmatter-validation.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  frontmatter-validation:
    name: Validate Markdown Frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create logs directory
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Install powershell-yaml
        run: |
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser

      - name: Run Frontmatter Validation
        id: frontmatter
        run: |
          $validationParams = @{
            ChangedFilesOnly = '${{ inputs.changed-files-only }}' -eq 'true'
            WarningsAsErrors = '${{ inputs.warnings-as-errors }}' -eq 'true'
            EnableSchemaValidation = '${{ inputs.enable-schema-validation }}' -eq 'true'
          }
          & scripts/linting/Invoke-FrontmatterValidation.ps1 @validationParams
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Upload frontmatter validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontmatter-validation-results
          path: logs/frontmatter-validation-results.json
          retention-days: 30

      - name: Check results and fail if needed
        if: ${{ !inputs.soft-fail }}
        run: |
          if ($env:FRONTMATTER_VALIDATION_FAILED -eq 'true') {
            Write-Host "Frontmatter validation failed. Failing the job."
            exit 1
          }

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: frontmatter-validation
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["frontmatter"]'
          reports: '[{"path":"logs/frontmatter-validation-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
