name: Fuzz Regression Tests

on:
  workflow_call:
    inputs:
      code-coverage:
        description: 'Enable Codecov coverage upload'
        required: false
        default: false
        type: boolean
    outputs:
      work-status:
        description: Execution status
        value: ${{ jobs.fuzz-regression.outputs.work-status }}
      expected-count:
        description: Selected operation count
        value: ${{ jobs.fuzz-regression.outputs.expected-count }}
      executed-count:
        description: Executed operation count
        value: ${{ jobs.fuzz-regression.outputs.executed-count }}
      artifact-id:
        description: Execution evidence artifact ID
        value: ${{ jobs.fuzz-regression.outputs.artifact-id }}
      artifact-url:
        description: Execution evidence artifact URL
        value: ${{ jobs.fuzz-regression.outputs.artifact-url }}
      test-count:
        description: Executed test case count
        value: ${{ jobs.fuzz-regression.outputs.test-count }}
      skipped-count:
        description: Skipped operation and test case count
        value: ${{ jobs.fuzz-regression.outputs.skipped-count }}
      first-failure:
        description: First failing operation
        value: ${{ jobs.fuzz-regression.outputs.first-failure }}

permissions:
  contents: read

jobs:
  fuzz-regression:
    name: Fuzz Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      work-status: ${{ steps.evidence.outputs.work-status }}
      expected-count: ${{ steps.evidence.outputs.expected-count }}
      executed-count: ${{ steps.evidence.outputs.executed-count }}
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      artifact-url: ${{ steps.evidence.outputs.artifact-url }}
      test-count: ${{ steps.evidence.outputs.test-count }}
      skipped-count: ${{ steps.evidence.outputs.skipped-count }}
      first-failure: ${{ steps.evidence.outputs.first-failure }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run fuzz regression tests
        id: test
        run: uv run pytest -o addopts="" tests/fuzz_harness.py -v --junitxml=logs/pytest-fuzz-results.xml --cov=tests --cov=data-management/viewer/backend/src --cov=training --cov-report=xml:logs/coverage-fuzz.xml --cov-report=term-missing

      - name: Upload coverage.xml artifact
        if: ${{ inputs.code-coverage && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-fuzz-coverage-xml
          path: logs/coverage-fuzz.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        if: ${{ inputs.code-coverage && always() }}
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: logs/coverage-fuzz.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest-fuzz
          name: pytest-fuzz-coverage

      - name: Publish execution evidence
        id: evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: fuzz-regression-tests
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["test"]'
          reports: '[{"path":"logs/pytest-fuzz-results.xml","kind":"junit"}]'
          selection-reason: Caller selected fuzz regression
          tools: '["node", "git", "python", "uv"]'
