name: Gitleaks Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on secret detection'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      NODE_DISABLE_COMPILE_CACHE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'

      - name: Download and verify gitleaks
        shell: bash
        run: |
          set -euo pipefail

          GITLEAKS_VERSION="8.30.0"
          GITLEAKS_SHA256="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_TARBALL="gitleaks.tar.gz"

          echo "Downloading gitleaks v${GITLEAKS_VERSION}..."
          curl -fsSL -o "${GITLEAKS_TARBALL}" "${GITLEAKS_URL}"

          echo "Verifying SHA256 checksum..."
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_TARBALL}" | sha256sum -c -

          echo "Extracting gitleaks binary..."
          tar -xzf "${GITLEAKS_TARBALL}" gitleaks
          chmod +x gitleaks

          echo "Gitleaks version:"
          ./gitleaks version

      - name: Test Gitleaks scan contracts
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/gitleaks
        run: node --test scripts/tests/security/gitleaks-scan.test.mjs

      - name: Run gitleaks scan
        id: gitleaks
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/gitleaks
          SOFT_FAIL: ${{ inputs.soft-fail == true }}
        run: node scripts/security/gitleaks-scan.mjs scan

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: logs/gitleaks-results.sarif
          category: gitleaks
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results
          path: logs/gitleaks-results.sarif
          retention-days: 90

      - name: Add job summary
        if: always()
        env:
          SCAN_STATUS: ${{ steps.gitleaks.outputs.scan-status }}
          SCAN_REVISION: ${{ steps.gitleaks.outputs.scan-revision }}
          SCAN_EXIT_CODE: ${{ steps.gitleaks.outputs.scan-exit-code }}
          SCAN_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: node scripts/security/gitleaks-scan.mjs summary
