name: Go Lint

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on Go lint failures'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only lint when Go files changed'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.go-lint.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.go-lint.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.go-lint.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.go-lint.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.go-lint.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.go-lint.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.go-lint.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.go-lint.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.changed-files-only && '0' || '1' }}

      - name: Create logs directory
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infrastructure/terraform/e2e/go.mod
          cache-dependency-path: infrastructure/terraform/e2e/go.mod

      - name: Run Go lint
        id: go-lint
        continue-on-error: ${{ inputs.soft-fail }}
        run: |
          $params = @{}
          if ('${{ inputs.changed-files-only }}' -eq 'true') {
            $params['ChangedFilesOnly'] = $true
          }
          ./scripts/linting/Invoke-GoLint.ps1 @params

      - name: Upload Go lint results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-lint-results
          path: logs/go-lint-results.json
          if-no-files-found: error

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: go-lint
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["go-lint"]'
          reports: '[{"path":"logs/go-lint-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
