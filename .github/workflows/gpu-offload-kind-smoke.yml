name: GPU Offload Kind Smoke

# End-to-end CPU-only smoke coverage for the gpu-offload stack: runs the
# first-run example against a real `kind` cluster to prove admission (the
# webhook mutates the client and generates the server Deployment) and a real
# remote call (the function executes on the generated server pod, not the
# client). detect-platform.sh resolves to platform=cpu on any GPU-less
# runner, and every GPU-only step in the pipeline self-skips, so this is a
# complete run of the real controller, Helm chart, and images without needing
# a GPU. See .github/workflows/pr-validation.yml (gpu_offload_e2e) for the
# path gate.

'on':
  workflow_call:
    outputs:
      work-status:
        description: Execution status
        value: ${{ jobs.kind-smoke.outputs.work-status }}
      expected-count:
        description: Selected operation count
        value: ${{ jobs.kind-smoke.outputs.expected-count }}
      executed-count:
        description: Executed operation count
        value: ${{ jobs.kind-smoke.outputs.executed-count }}
      artifact-id:
        description: Execution evidence artifact ID
        value: ${{ jobs.kind-smoke.outputs.artifact-id }}
      artifact-url:
        description: Execution evidence artifact URL
        value: ${{ jobs.kind-smoke.outputs.artifact-url }}
      test-count:
        description: Executed test case count
        value: ${{ jobs.kind-smoke.outputs.test-count }}
      skipped-count:
        description: Skipped operation and test case count
        value: ${{ jobs.kind-smoke.outputs.skipped-count }}
      first-failure:
        description: First failing operation
        value: ${{ jobs.kind-smoke.outputs.first-failure }}

permissions:
  contents: read

jobs:
  kind-smoke:
    name: Kind Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      work-status: ${{ steps.evidence.outputs.work-status }}
      expected-count: ${{ steps.evidence.outputs.expected-count }}
      executed-count: ${{ steps.evidence.outputs.executed-count }}
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      artifact-url: ${{ steps.evidence.outputs.artifact-url }}
      test-count: ${{ steps.evidence.outputs.test-count }}
      skipped-count: ${{ steps.evidence.outputs.skipped-count }}
      first-failure: ${{ steps.evidence.outputs.first-failure }}
    env:
      # Force the deterministic CPU/kind path rather than relying on
      # runner auto-detection (detect-platform.sh would resolve the same way
      # on a GPU-less runner, but this keeps the gate explicit).
      GPU_OFFLOAD_PLATFORM: cpu
    defaults:
      run:
        working-directory: gpu-offload
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install host packages
        run: scripts/install-host-packages.sh

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          working_directory: gpu-offload

      - name: Trust the gpu-offload mise config
        run: mise trust

      - name: Install kind, kubectl, and Helm
        run: mise run b-host-02-kubernetes-tools

      - name: Set up the offload cluster
        id: setup
        run: mise run f-10-setup

      - name: Verify admission and remote execution
        id: verify
        run: mise run f-20-verify

      - name: Tear down the cluster
        id: cleanup
        if: always()
        run: mise run f-40-teardown-all

      - name: Publish execution evidence
        id: evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: gpu-offload-kind-smoke
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["setup", "verify", "cleanup"]'
          selection-reason: Caller selected CPU kind admission and remote execution
          tools: '["node", "git"]'
