name: Markdown Link Check

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on broken links'
        required: false
        type: boolean
        default: true
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.markdown-link-check.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.markdown-link-check.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.markdown-link-check.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.markdown-link-check.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.markdown-link-check.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.markdown-link-check.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.markdown-link-check.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.markdown-link-check.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  markdown-link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Create logs directory
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Run markdown link check
        id: link-check
        run: ./scripts/linting/Markdown-Link-Check.ps1
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Upload markdown link check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-link-check-results
          path: logs/markdown-link-check-results.json
          retention-days: 30

      - name: Check results and fail if needed
        if: ${{ !inputs.soft-fail && steps.link-check.outcome == 'failure' }}
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
          Write-CIAnnotation -Level Error -Message 'Markdown link check found broken links — see annotations and step summary above for details'
          exit 1

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: markdown-link-check
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["link-check"]'
          reports: '[{"path":"logs/markdown-link-check-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
