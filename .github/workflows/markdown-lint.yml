name: Markdown Lint

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on markdown lint violations'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.markdown-lint.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.markdown-lint.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.markdown-lint.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.markdown-lint.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.markdown-lint.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.markdown-lint.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.markdown-lint.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.markdown-lint.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run markdown lint
        id: markdown-lint
        run: npm run lint:md
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: markdown-lint
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["markdown-lint"]'
          fail-on-error: ${{ !inputs.soft-fail }}
