name: ms.date Freshness Check

on:
  workflow_call:
    inputs:
      staleness-threshold-days:
        description: 'Number of days before ms.date is considered stale'
        required: false
        type: number
        default: 90
      changed-files-only:
        description: 'Only check changed markdown files'
        required: false
        type: boolean
        default: false
      soft-fail:
        description: 'Prevent PR failures when ms.date issues are detected'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.msdate-freshness.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.msdate-freshness.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.msdate-freshness.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.msdate-freshness.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.msdate-freshness.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.msdate-freshness.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.msdate-freshness.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.msdate-freshness.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  msdate-freshness:
    name: Check ms.date Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create logs directory
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Install powershell-yaml
        run: |
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser

      - name: Run ms.date Freshness Check
        id: freshness
        env:
          THRESHOLD_DAYS: ${{ inputs.staleness-threshold-days }}
          CHANGED_FILES_ONLY: ${{ inputs.changed-files-only }}
        run: |
          $params = @{
            ThresholdDays = [int]$env:THRESHOLD_DAYS
          }
          if ($env:CHANGED_FILES_ONLY -eq 'true') {
            $params['ChangedFilesOnly'] = $true
          }
          & scripts/linting/Invoke-MsDateFreshnessCheck.ps1 @params
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Upload freshness check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msdate-freshness-results
          path: logs/msdate-freshness-results.json
          retention-days: 30

      - name: Upload job summary
        if: always()
        run: |
          if (Test-Path logs/msdate-summary.md) {
            Get-Content logs/msdate-summary.md >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: msdate-freshness-check
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["freshness"]'
          reports: '[{"path":"logs/msdate-freshness-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
