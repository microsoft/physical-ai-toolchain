name: Pester Tests

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on test failures'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Whether to run only tests for changed files'
        required: false
        type: boolean
        default: false
      code-coverage:
        description: 'Whether to collect code coverage'
        required: false
        type: boolean
        default: false
    outputs:
      work-status:
        value: ${{ jobs.aggregate.outputs.work-status }}
      expected-count:
        value: ${{ jobs.aggregate.outputs.expected-count }}
      executed-count:
        value: ${{ jobs.aggregate.outputs.executed-count }}
      artifact-id:
        value: ${{ jobs.aggregate.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.aggregate.outputs.artifact-url }}
      test-count:
        value: ${{ jobs.aggregate.outputs.test-count }}
      skipped-count:
        value: ${{ jobs.aggregate.outputs.skipped-count }}
      first-failure:
        value: ${{ jobs.aggregate.outputs.first-failure }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  pester:
    name: PowerShell Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create logs directory
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Install Pester
        id: install-pester
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1

      - name: Install PowerShell-Yaml
        id: install-yaml
        run: |
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Get changed files
        id: changed-files
        if: inputs.changed-files-only
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1

          # Determine base ref for comparison
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseRef = "origin/${{ github.base_ref }}"
          } else {
            $baseRef = 'HEAD~1'
          }

          # Get changed PowerShell files
          $changedFiles = git diff --name-only $baseRef -- '*.ps1' '*.psm1' '*.psd1' 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to select Pester tests from the Git comparison'
          }
          if (-not $changedFiles) {
            Write-Host "No PowerShell files changed"
            Set-CIOutput -Name 'has-changes' -Value 'false'
            return
          }

          Set-CIOutput -Name 'has-changes' -Value 'true'

          # Map source files to test files
          $testPaths = @()
          foreach ($file in $changedFiles) {
            Write-Host "Changed: $file"

            # Direct test file change
            if ($file -match '\.Tests\.ps1$') {
              $testPaths += $file
              continue
            }

            # Map source to test: scripts/security/Foo.ps1 -> scripts/tests/security/Foo.Tests.ps1
            if ($file -match '^scripts/(?!tests/)(.+)\.psm?1$') {
              $relativePath = $Matches[1]
              $testFile = "scripts/tests/$relativePath.Tests.ps1"
              if (Test-Path $testFile) {
                $testPaths += $testFile
              }
            }

            # Map scripts/lib/ source to test: scripts/lib/Foo.ps1 -> scripts/tests/lib/Foo.Tests.ps1
            if ($file -match '^scripts/lib/(.+)\.psm?1$') {
              $relativePath = $Matches[1]
              $testFile = "scripts/tests/lib/$relativePath.Tests.ps1"
              if (Test-Path $testFile) {
                $testPaths += $testFile
              }
            }

            # Map scripts/ root source to test: scripts/Foo.ps1 -> scripts/tests/Foo.Tests.ps1
            if ($file -match '^scripts/([^/]+)\.psm?1$') {
              $relativePath = $Matches[1]
              $testFile = "scripts/tests/$relativePath.Tests.ps1"
              if (Test-Path $testFile) {
                $testPaths += $testFile
              }
            }
          }

          $uniquePaths = $testPaths | Sort-Object -Unique
          if ($uniquePaths) {
            Write-Host "Test files to run:"
            $uniquePaths | ForEach-Object { Write-Host "  $_" }
            Set-CIOutput -Name 'test-paths' -Value ($uniquePaths -join ',')
          }
          else {
            Write-Host "No matching test files found for changed source files"
            Set-CIOutput -Name 'has-changes' -Value 'false'
          }

      - name: Run Pester Tests
        id: pester
        if: "!inputs.changed-files-only || steps.changed-files.outputs.has-changes == 'true'"
        continue-on-error: ${{ inputs.soft-fail }}
        run: |
          # Capture workspace root before Pester — test mocks may clear $env:GITHUB_WORKSPACE
          $workspaceRoot = $env:GITHUB_WORKSPACE
          $ciHelpersPath = Join-Path $workspaceRoot 'scripts/lib/Modules/CIHelpers.psm1'

          Import-Module $ciHelpersPath

          $env:PESTER_FAILED = 'false'

          $configParams = @{}
          if ('${{ inputs.code-coverage }}' -eq 'true') {
            $configParams['CodeCoverage'] = $true
          }

          # Filter to specific test files if running changed-files-only
          $testPaths = '${{ steps.changed-files.outputs.test-paths }}'
          if ($testPaths -and '${{ inputs.changed-files-only }}' -eq 'true') {
            $configParams['TestPath'] = $testPaths -split ','
          }

          try {
            $config = & scripts/tests/pester.config.ps1 -CI @configParams
            $config.Run.Exit = $false
            $config.TestResult.OutputPath = Join-Path $workspaceRoot 'logs/pester-results-${{ matrix.os }}.xml'
            $result = Invoke-Pester -Configuration $config

            # Re-import CIHelpers — Pester module isolation unloads it during test execution
            Import-Module $ciHelpersPath -Force

            if ($result.Result -ne 'Passed' -or $result.PassedCount -eq 0) {
              $env:PESTER_FAILED = 'true'
              Set-CIOutput -Name 'pester-failed' -Value 'true'
              Write-Warning "Pester result: $($result.Result); $($result.PassedCount) passed, $($result.FailedCount) failed"
              exit 1
            }
            else {
              Set-CIOutput -Name 'pester-failed' -Value 'false'
              Write-Host "All $($result.PassedCount) tests passed"
            }
          }
          catch {
            $env:PESTER_FAILED = 'true'
            Import-Module $ciHelpersPath -Force -ErrorAction SilentlyContinue
            Set-CIOutput -Name 'pester-failed' -Value 'true'
            Write-Error "Pester execution failed: $_"
            exit 1
          }

      - name: Upload test results
        if: always() && steps.pester.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-results-${{ matrix.os }}
          path: logs/pester-results-${{ matrix.os }}.xml
          retention-days: 30

      - name: Upload Coverage Report
        if: matrix.os == 'ubuntu-latest' && inputs.code-coverage && always() && steps.pester.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ matrix.os }}
          path: logs/coverage-pester.xml
          retention-days: 30

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest' && inputs.code-coverage && always() && steps.pester.outcome != 'skipped'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          use_oidc: true
          files: logs/coverage-pester.xml
          flags: pester
          name: pester-coverage
          verbose: true
          fail_ci_if_error: false

      - name: Coverage Threshold Check
        id: coverage-policy
        if: always()
        run: |
          if ('${{ inputs.code-coverage }}' -ne 'true' -or '${{ matrix.os }}' -ne 'ubuntu-latest') {
            Write-Host 'Coverage is not requested for this shard'
            exit 0
          }
          if (Test-Path logs/coverage-pester.xml) {
            [xml]$coverage = Get-Content logs/coverage-pester.xml
            $lineRate = $coverage.report.counter |
              Where-Object { $_.type -eq 'LINE' } |
              ForEach-Object {
                $missed = [int]$_.missed
                $covered = [int]$_.covered
                if (($missed + $covered) -gt 0) { [math]::Round(($covered / ($missed + $covered)) * 100, 2) } else { 0 }
              }

            # Matches CoveragePercentTarget in pester.config.ps1
            $threshold = 80

            Write-Host "Line coverage: $lineRate%"
            Write-Host "Threshold: $threshold%"

            if ($lineRate -lt $threshold) {
              Write-Warning "Coverage $lineRate% is below threshold $threshold%"
              exit 1
            }
            else {
              Write-Host "Coverage $lineRate% meets threshold $threshold%"
            }
          }
          else {
            throw 'Coverage report not found at logs/coverage-pester.xml'
          }

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: pester-tests
          shard: ${{ matrix.os }}
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["install-pester","install-yaml","pester","coverage-policy"]'
          reports: '[{"path":"logs/pester-results-${{ matrix.os }}.xml","kind":"nunit"}]'
          fail-on-error: ${{ !inputs.soft-fail }}

  aggregate:
    name: Aggregate Pester tests
    if: always()
    needs: pester
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: pester-tests
          needs-json: ${{ toJSON(needs) }}
          expected-shards: '{"pester":["ubuntu-latest"]}'
          fail-on-error: ${{ !inputs.soft-fail }}
