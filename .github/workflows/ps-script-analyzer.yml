name: PowerShell Lint

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on PSScriptAnalyzer violations'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only analyze changed PowerShell files'
        required: false
        type: boolean
        default: true
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.psscriptanalyzer.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.psscriptanalyzer.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.psscriptanalyzer.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.psscriptanalyzer.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.psscriptanalyzer.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.psscriptanalyzer.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.psscriptanalyzer.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.psscriptanalyzer.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create logs directory
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Run PSScriptAnalyzer
        id: analyze
        continue-on-error: ${{ inputs.soft-fail }}
        run: |
          $scriptArgs = @{ OutputPath = 'logs/psscriptanalyzer-results.json' }
          if ('${{ inputs.changed-files-only }}' -eq 'true') {
            $scriptArgs['ChangedFilesOnly'] = $true
          }
          & scripts/linting/Invoke-PSScriptAnalyzer.ps1 @scriptArgs

      - name: Upload PSScriptAnalyzer results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psscriptanalyzer-results
          path: logs/
          retention-days: 30

      - name: Check results
        if: ${{ !inputs.soft-fail }}
        run: |
          if ($env:PSSCRIPTANALYZER_FAILED -eq 'true') {
            Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
            Write-CIAnnotation -Level Error -Message 'PSScriptAnalyzer found violations — see annotations above for details'
            exit 1
          }

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: ps-script-analyzer
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["analyze"]'
          reports: '[{"path":"logs/psscriptanalyzer-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
