---
name: Pytest Data Pipeline

'on':
  workflow_call:
    inputs:
      code-coverage:
        description: 'Enable Codecov coverage upload'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pytest-data-pipeline:
    name: Pytest Data Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.12.8'

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run pytest
        run: >-
          uv run --frozen pytest -o addopts="" data-pipeline/capture/tests -v
          --cov=data-pipeline/capture
          --cov-report=term-missing
          --cov-report=xml:logs/coverage-data-pipeline.xml
          --cov-fail-under=80

      - name: Upload coverage.xml artifact
        if: always()
        continue-on-error: ${{ job.status == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-data-pipeline-coverage-xml
          path: logs/coverage-data-pipeline.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage to Codecov
        if: ${{ inputs.code-coverage && always() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: logs/coverage-data-pipeline.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest-data-pipeline
          name: pytest-data-pipeline-coverage
