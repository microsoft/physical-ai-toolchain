---
name: Pytest GPU Offload

'on':
  workflow_call:
    outputs:
      work-status:
        value: ${{ jobs.aggregate.outputs.work-status }}
      expected-count:
        value: ${{ jobs.aggregate.outputs.expected-count }}
      executed-count:
        value: ${{ jobs.aggregate.outputs.executed-count }}
      artifact-id:
        value: ${{ jobs.aggregate.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.aggregate.outputs.artifact-url }}
      test-count:
        value: ${{ jobs.aggregate.outputs.test-count }}
      skipped-count:
        value: ${{ jobs.aggregate.outputs.skipped-count }}
      first-failure:
        value: ${{ jobs.aggregate.outputs.first-failure }}

permissions:
  contents: read

jobs:
  pytest-gpu-offload:
    name: Pytest GPU Offload (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            path: gpu-offload/controller
          - name: runtime
            path: gpu-offload/runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.12.8'

      - name: Install dependencies
        id: install
        working-directory: ${{ matrix.path }}
        run: uv sync --frozen --extra test

      - name: Run pytest
        id: test
        working-directory: ${{ matrix.path }}
        run: uv run --frozen pytest -o addopts="" tests -v --junitxml="$GITHUB_WORKSPACE/logs/pytest-gpu-offload-${{ matrix.name }}-results.xml"

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: pytest-gpu-offload
          shard: ${{ matrix.name }}
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["install","test"]'
          reports: '[{"path":"logs/pytest-gpu-offload-${{ matrix.name }}-results.xml","kind":"junit"}]'

  aggregate:
    name: Aggregate GPU offload tests
    if: always()
    needs: pytest-gpu-offload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: pytest-gpu-offload
          needs-json: ${{ toJSON(needs) }}
          expected-shards: '{"pytest-gpu-offload":["controller","runtime"]}'
