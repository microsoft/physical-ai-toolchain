---
name: Pytest Shared CI

'on':
  workflow_call:
    inputs:
      code-coverage:
        description: 'Enable Codecov coverage upload'
        required: false
        default: false
        type: boolean
    outputs:
      work-status:
        value: ${{ jobs.pytest-shared-ci.outputs.work-status }}
      expected-count:
        value: ${{ jobs.pytest-shared-ci.outputs.expected-count }}
      executed-count:
        value: ${{ jobs.pytest-shared-ci.outputs.executed-count }}
      artifact-id:
        value: ${{ jobs.pytest-shared-ci.outputs.artifact-id }}
      artifact-url:
        value: ${{ jobs.pytest-shared-ci.outputs.artifact-url }}
      test-count:
        value: ${{ jobs.pytest-shared-ci.outputs.test-count }}
      skipped-count:
        value: ${{ jobs.pytest-shared-ci.outputs.skipped-count }}
      first-failure:
        value: ${{ jobs.pytest-shared-ci.outputs.first-failure }}

permissions:
  contents: read

jobs:
  pytest-shared-ci:
    name: Pytest Shared CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: '0.12.20'
          checksum: '6590717592ace991ff83a63fef799e3ad9d33ecc8f96c5d6bdd732496e79337f'

      - name: Install dependencies
        id: install
        run: uv sync --frozen --group dev

      - name: Run pytest
        id: test
        run: >-
          uv run --frozen pytest -o addopts="" shared/ci/tests scripts/tests/security/test_zap_to_sarif.py -v
          --junitxml=logs/pytest-shared-ci-results.xml
          --cov=shared/ci
          --cov-report=term-missing
          --cov-report=xml:logs/coverage-shared-ci.xml
          --cov-fail-under=80

      - name: Upload coverage.xml artifact
        if: always()
        continue-on-error: ${{ job.status == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-shared-ci-coverage-xml
          path: logs/coverage-shared-ci.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage to Codecov
        if: ${{ inputs.code-coverage && always() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: logs/coverage-shared-ci.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest-shared-ci
          name: pytest-shared-ci-coverage

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: pytest-shared-ci
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["install","test"]'
          reports: '[{"path":"logs/pytest-shared-ci-results.xml","kind":"junit"}]'
