name: Python Lint

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on Python linting errors'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.ruff.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.ruff.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.ruff.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.ruff.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.ruff.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.ruff.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.ruff.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.ruff.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ruff:
    name: Ruff Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.12.8'

      # Ruff version is pinned to match the `ruff` dev-dependency pin in the root
      # pyproject.toml. Keep these in sync; bump both together (via Dependabot).
      - name: Ruff lint check
        id: ruff-check
        continue-on-error: true
        run: |
          uvx --with ruff==0.15.21 ruff check . --output-format github 2>&1 | Tee-Object -FilePath ruff-check-results.txt
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            'RUFF_CHECK_FAILED=true' >> $env:GITHUB_ENV
          }
          exit $exitCode

      - name: Ruff format check
        id: ruff-format
        continue-on-error: true
        run: |
          uvx --with ruff==0.15.21 ruff format --check --diff . 2>&1 | Tee-Object -FilePath ruff-format-results.txt
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            'RUFF_FORMAT_FAILED=true' >> $env:GITHUB_ENV
          }
          exit $exitCode

      - name: HuggingFace revision-pin guard
        id: hf-pins
        continue-on-error: true
        run: |
          python3 scripts/security/check_hf_pins.py
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            'HF_PINS_FAILED=true' >> $env:GITHUB_ENV
          }
          exit $exitCode

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-lint-results
          path: |
            ruff-check-results.txt
            ruff-format-results.txt
          retention-days: 30

      - name: Fail job if errors found
        if: (env.RUFF_CHECK_FAILED == 'true' || env.RUFF_FORMAT_FAILED == 'true' || env.HF_PINS_FAILED == 'true') && !inputs.soft-fail
        run: |
          Write-Output "::error::Python lint violations detected. Run 'uvx --with ruff==0.15.21 ruff check --fix .', 'uvx --with ruff==0.15.21 ruff format .', and 'npm run lint:hfpins' locally."
          exit 1

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: python-lint
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["ruff-check","ruff-format","hf-pins"]'
          reports: '[{"path":"ruff-check-results.txt","kind":"file"},{"path":"ruff-format-results.txt","kind":"file"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
