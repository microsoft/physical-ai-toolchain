name: ShellCheck

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on ShellCheck failures'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only lint when shell files changed'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.shellcheck.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.shellcheck.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.shellcheck.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.shellcheck.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.shellcheck.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.shellcheck.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.shellcheck.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.shellcheck.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.changed-files-only && '0' || '1' }}

      - name: Create logs directory
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
        shell: bash

      - name: Run ShellCheck
        id: shellcheck
        continue-on-error: ${{ inputs.soft-fail }}
        run: |
          $params = @{}
          if ('${{ inputs.changed-files-only }}' -eq 'true') {
            $params['ChangedFilesOnly'] = $true
          }
          ./scripts/linting/Invoke-ShellCheck.ps1 @params

      - name: Upload ShellCheck results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shellcheck-results
          path: logs/shellcheck-results.json
          if-no-files-found: error

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: shellcheck
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["shellcheck"]'
          reports: '[{"path":"logs/shellcheck-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
