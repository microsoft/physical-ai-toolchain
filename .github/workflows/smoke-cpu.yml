name: Smoke (GPU-free)

# GPU-free import smoke gate. Two depths, both on standard runners:
#   - CPU import smoke runs for every domain, unconditionally, on each PR.
#   - Runtime-image smoke pulls a domain's real container and imports it on the
#     real interpreter; path-gated by the caller because it pulls a large image.

'on':
  workflow_call:
    inputs:
      rl:
        description: 'Run the RL runtime-image smoke (training/rl changed)'
        required: false
        default: false
        type: boolean
      il:
        description: 'Run the LeRobot runtime-image smoke (training/il changed)'
        required: false
        default: false
        type: boolean
      vla:
        description: 'Run the VLA runtime-image smoke (training/vla changed)'
        required: false
        default: false
        type: boolean
      evaluation:
        description: 'Run the evaluation runtime-image smoke (evaluation changed)'
        required: false
        default: false
        type: boolean
      osmo_replay:
        description: 'Run the OSMO replay runtime-image smoke (workflows/osmo changed)'
        required: false
        default: false
        type: boolean
      dataviewer:
        description: 'Build the dataviewer compose stack (viewer images/compose changed)'
        required: false
        default: false
        type: boolean
    outputs:
      work-status:
        description: Aggregate execution status
        value: ${{ jobs.outcome.outputs.work-status }}
      expected-count:
        description: Selected operation count
        value: ${{ jobs.outcome.outputs.expected-count }}
      executed-count:
        description: Executed operation count
        value: ${{ jobs.outcome.outputs.executed-count }}
      artifact-id:
        description: Execution evidence artifact ID
        value: ${{ jobs.outcome.outputs.artifact-id }}
      artifact-url:
        description: Execution evidence artifact URL
        value: ${{ jobs.outcome.outputs.artifact-url }}
      test-count:
        description: Executed test case count
        value: ${{ jobs.outcome.outputs.test-count }}
      skipped-count:
        description: Skipped operation and test case count
        value: ${{ jobs.outcome.outputs.skipped-count }}
      first-failure:
        description: First failing operation
        value: ${{ jobs.outcome.outputs.first-failure }}

permissions:
  contents: read

jobs:
  # Every CPU domain is required; only runtime-image work is caller-selected.
  import-smoke:
    name: CPU Import Smoke (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        domain: [rl, il, vla, evaluation, vlm-judge, osmo-replay]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: '0.12.8'

      - name: Verify uv bootstrap recovery
        if: matrix.domain == 'rl'
        run: bash shared/ci/tests/smoke-import-bootstrap.sh

      - name: CPU import smoke
        id: smoke
        run: shared/ci/smoke-import.sh ${{ matrix.domain }} --mode cpu

      - name: Publish execution evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          shard: cpu-${{ matrix.domain }}
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["smoke"]'
          selection-reason: Unconditional CPU domain baseline
          tools: '["node", "git", "uv"]'

  # Runtime-image smoke: import the domain inside its real production container,
  # on the real interpreter. Path-gated (large image pull) via the caller input.
  image-smoke-rl:
    name: Runtime-Image Smoke (rl)
    if: inputs.rl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true

      - name: Runtime-image smoke
        id: smoke
        run: shared/ci/smoke-image.sh rl

      - name: Publish execution evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          shard: image-rl
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["smoke"]'
          selection-reason: Caller selected RL runtime image

  image-smoke-il:
    name: Runtime-Image Smoke (il)
    if: inputs.il
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true

      - name: Runtime-image smoke
        id: smoke
        run: shared/ci/smoke-image.sh il

      - name: Publish execution evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          shard: image-il
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["smoke"]'
          selection-reason: Caller selected IL runtime image

  image-smoke-evaluation:
    name: Runtime-Image Smoke (evaluation)
    if: inputs.evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true

      - name: Runtime-image smoke
        id: smoke
        run: shared/ci/smoke-image.sh evaluation

      - name: Publish execution evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          shard: image-evaluation
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["smoke"]'
          selection-reason: Caller selected evaluation runtime image

  image-smoke-vla:
    name: Runtime-Image Smoke (vla)
    if: inputs.vla
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true

      - name: Runtime-image smoke
        id: smoke
        run: shared/ci/smoke-image.sh vla

      - name: Publish execution evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          shard: image-vla
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["smoke"]'
          selection-reason: Caller selected VLA runtime image

  image-smoke-osmo-replay:
    name: Runtime-Image Smoke (osmo-replay)
    if: inputs.osmo_replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Runtime-image smoke
        id: smoke
        run: shared/ci/smoke-image.sh osmo-replay

      - name: Publish execution evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          shard: image-osmo-replay
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["smoke"]'
          selection-reason: Caller selected OSMO replay runtime image

  # Docker compose smoke: build the dataviewer images on their pinned bases,
  # start the stack, and wait for both services to report healthy. Path-gated by
  # the caller. Covers the compose stack that no other check rebuilds or runs.
  build-smoke-dataviewer:
    name: Docker Compose Smoke (dataviewer)
    if: inputs.dataviewer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run compose stack
        id: smoke
        run: shared/ci/smoke-docker.sh

      - name: Publish execution evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          shard: compose-dataviewer
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["smoke"]'
          selection-reason: Caller selected dataviewer compose stack

  outcome:
    name: Smoke Execution Summary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs:
      - import-smoke
      - image-smoke-rl
      - image-smoke-il
      - image-smoke-evaluation
      - image-smoke-vla
      - image-smoke-osmo-replay
      - build-smoke-dataviewer
    outputs:
      work-status: ${{ steps.evidence.outputs.work-status }}
      expected-count: ${{ steps.evidence.outputs.expected-count }}
      executed-count: ${{ steps.evidence.outputs.executed-count }}
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      artifact-url: ${{ steps.evidence.outputs.artifact-url }}
      test-count: ${{ steps.evidence.outputs.test-count }}
      skipped-count: ${{ steps.evidence.outputs.skipped-count }}
      first-failure: ${{ steps.evidence.outputs.first-failure }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate execution evidence
        id: evidence
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: smoke-cpu
          needs-json: ${{ toJSON(needs) }}
          expected-shards: >-
            {
              "import-smoke": ["cpu-rl", "cpu-il", "cpu-vla", "cpu-evaluation", "cpu-vlm-judge", "cpu-osmo-replay"],
              "image-smoke-rl": ${{ inputs.rl && '["image-rl"]' || '[]' }},
              "image-smoke-il": ${{ inputs.il && '["image-il"]' || '[]' }},
              "image-smoke-evaluation": ${{ inputs.evaluation && '["image-evaluation"]' || '[]' }},
              "image-smoke-vla": ${{ inputs.vla && '["image-vla"]' || '[]' }},
              "image-smoke-osmo-replay": ${{ inputs.osmo_replay && '["image-osmo-replay"]' || '[]' }},
              "build-smoke-dataviewer": ${{ inputs.dataviewer && '["compose-dataviewer"]' || '[]' }}
            }
