name: Spell Check

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on spell check errors'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.spell-check.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.spell-check.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.spell-check.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.spell-check.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.spell-check.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.spell-check.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.spell-check.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.spell-check.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Create logs directory
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Run spell check
        id: spell-check
        run: |
          npm run spell-check 2>&1 | Tee-Object -FilePath logs/spell-check-results.txt
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            'SPELL_CHECK_FAILED=true' >> $env:GITHUB_ENV
          }
          exit $exitCode
        continue-on-error: true

      - name: Create annotations
        if: env.SPELL_CHECK_FAILED == 'true'
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
          foreach ($line in (Get-Content logs/spell-check-results.txt -ErrorAction SilentlyContinue)) {
            if ($line -match '^(.+):(\d+):(\d+)\s-\s(.+)$') {
              $file = $Matches[1] -replace [regex]::Escape("$env:GITHUB_WORKSPACE/"), ''
              Write-CIAnnotation -Level Error -Message $Matches[4] -File $file -Line ([int]$Matches[2]) -Column ([int]$Matches[3])
            }
          }

      - name: Upload spell check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spell-check-results
          path: logs/spell-check-results.txt
          retention-days: 30

      - name: Add job summary
        if: always()
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
          if ('${{ steps.spell-check.outcome }}' -ne 'success') {
            $rows = @()
            foreach ($line in (Get-Content logs/spell-check-results.txt -ErrorAction SilentlyContinue)) {
              if ($line -match '^(.+):(\d+):(\d+)\s-\s(.+)$') {
                $file = $Matches[1] -replace [regex]::Escape("$env:GITHUB_WORKSPACE/"), ''
                $rows += "| ``$file`` | $($Matches[2]) | $($Matches[3]) | $($Matches[4]) |"
              }
            }
            $md = @(
              '## Spell Check Results'
              '❌ **Status**: Failed'
              ''
              '| File | Line | Col | Issue |'
              '|------|------|-----|-------|'
            ) + $rows
            Write-CIStepSummary -Content ($md -join "`n")
          }
          else {
            $md = @(
              '## Spell Check Results'
              '✅ **Status**: Passed'
              ''
              'No spelling errors detected.'
            )
            Write-CIStepSummary -Content ($md -join "`n")
          }

      - name: Fail job if errors found
        if: env.SPELL_CHECK_FAILED == 'true' && !inputs.soft-fail
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
          Write-CIAnnotation -Level Error -Message 'Spell check found errors — see step summary and spell-check-results artifact for details'
          exit 1

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: spell-check
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["spell-check"]'
          reports: '[{"path":"logs/spell-check-results.txt","kind":"file"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
