name: Table Format Check

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on table format issues'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.table-format.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.table-format.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.table-format.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.table-format.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.table-format.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.table-format.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.table-format.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.table-format.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  table-format:
    name: Table Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Check table formatting
        id: table-format
        run: |
          npm run format:tables 2>&1 | Tee-Object -FilePath table-format-output.txt
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            'TABLE_FORMAT_FAILED=true' >> $env:GITHUB_ENV
          }
          exit $exitCode
        continue-on-error: true

      - name: Create annotations
        if: env.TABLE_FORMAT_FAILED == 'true'
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
          $changed = (git diff --name-only -- '*.md' 2>$null) | Where-Object { $_ }
          if ($changed) {
            foreach ($file in $changed) {
              Write-CIAnnotation -Level Error -Message "Table formatting issues — run 'npm run format:tables' locally to fix" -File $file
            }
          }
          else {
            Write-CIAnnotation -Level Error -Message 'Table format check failed — see step log for details'
          }

      - name: Upload table format results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: table-format-results
          path: table-format-output.txt
          retention-days: 30

      - name: Add job summary
        if: always()
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
          if ('${{ steps.table-format.outcome }}' -ne 'success') {
            $changed = (git diff --name-only -- '*.md' 2>$null) | Where-Object { $_ }
            $md = @(
              '## Table Format Check Results'
              '❌ **Status**: Failed'
              ''
            )
            if ($changed) {
              $md += '### Files with table formatting issues'
              $md += ''
              foreach ($file in $changed) {
                $md += "- ``$file``"
              }
              $md += ''
            }
            $md += @(
              '⚠️ **Note**: This check does NOT auto-fix tables.'
              ''
              '**To fix manually:**'
              '1. Run `npm run format:tables` locally'
              '2. Review and commit the changes'
              '3. Push to update this PR'
            )
            Write-CIStepSummary -Content ($md -join "`n")
          }
          else {
            $md = @(
              '## Table Format Check Results'
              '✅ **Status**: Passed'
              ''
              'All tables are properly formatted.'
            )
            Write-CIStepSummary -Content ($md -join "`n")
          }

      - name: Fail job if issues found
        if: env.TABLE_FORMAT_FAILED == 'true' && !inputs.soft-fail
        run: |
          Import-Module $env:GITHUB_WORKSPACE/scripts/lib/Modules/CIHelpers.psm1
          Write-CIAnnotation -Level Error -Message "Table format check failed — run 'npm run format:tables' locally to fix. See step summary for details"
          exit 1

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: table-format
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["table-format"]'
          reports: '[{"path":"table-format-output.txt","kind":"file"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
