name: Terraform Docs Check

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on terraform-docs drift detection'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only check directories with changed Terraform files'
        required: false
        type: boolean
        default: false
      terraform-docs-version:
        description: 'terraform-docs version to install'
        required: false
        type: string
        default: 'v0.21.0'
      terraform-docs-sha256:
        description: 'SHA256 checksum of terraform-docs linux-amd64 tarball'
        required: false
        type: string
        default: '2fdd81b8d21ff1498cd559af0dcc5d155835f84600db06d3923e217124fc735a'
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.terraform-docs-check.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.terraform-docs-check.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.terraform-docs-check.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.terraform-docs-check.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.terraform-docs-check.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.terraform-docs-check.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.terraform-docs-check.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.terraform-docs-check.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  terraform-docs-check:
    name: Terraform Docs Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.changed-files-only && '0' || '1' }}

      - name: Create logs directory
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Install terraform-docs
        run: |
          $version = '${{ inputs.terraform-docs-version }}'
          $expectedSha = '${{ inputs.terraform-docs-sha256 }}'
          $tarball = 'terraform-docs.tar.gz'
          $url = "https://github.com/terraform-docs/terraform-docs/releases/download/${version}/terraform-docs-${version}-linux-amd64.tar.gz"

          Invoke-WebRequest -Uri $url -OutFile $tarball

          $actualSha = (Get-FileHash -Path $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "SHA256 mismatch for terraform-docs ${version}: expected '${expectedSha}', got '${actualSha}'"
          }
          Write-Output "SHA256 verified: ${actualSha}"

          tar -xzf $tarball
          sudo mv terraform-docs /usr/local/bin/
          terraform-docs --version

      - name: Run terraform-docs check
        id: docs
        continue-on-error: ${{ inputs.soft-fail }}
        run: |
          $params = @{}
          if ('${{ inputs.changed-files-only }}' -eq 'true') {
            $params['ChangedFilesOnly'] = $true
          }
          scripts/linting/Invoke-TerraformDocsCheck.ps1 @params

      - name: Upload terraform-docs check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-docs-check-results
          path: logs/terraform-docs-check-results.json
          retention-days: 30

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: terraform-docs-check
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["docs"]'
          reports: '[{"path":"logs/terraform-docs-check-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
