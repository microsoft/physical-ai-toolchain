name: Terraform Security Scan

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory passed to checkov via -d
        required: false
        type: string
        default: infrastructure/terraform
      soft-fail:
        description: Whether to continue on Checkov violations
        required: false
        type: boolean
        default: true
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.checkov.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.checkov.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.checkov.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.checkov.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.checkov.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.checkov.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.checkov.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.checkov.outputs.first-failure }}'}

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@29be5868bfa968f099ae80169f61f42887494b8f # v12.3133.0
        continue-on-error: ${{ inputs.soft-fail }}
        with:
          directory: ${{ inputs.working-directory }}
          framework: terraform
          output_format: sarif
          soft_fail: ${{ inputs.soft-fail }}
          download_external_modules: false

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: checkov

      - name: Upload Checkov SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 30

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: terraform-security
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["checkov"]'
          reports: '[{"path":"results.sarif","kind":"sarif","tool":"Checkov"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
