name: Terraform Validation

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on Terraform validation failures'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only validate directories with changed Terraform files'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.terraform-validation.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.terraform-validation.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.terraform-validation.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.terraform-validation.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.terraform-validation.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.terraform-validation.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.terraform-validation.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.terraform-validation.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.changed-files-only && '0' || '1' }}

      - name: Create logs directory
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false

      - name: Run Terraform Validation
        id: validate
        continue-on-error: ${{ inputs.soft-fail }}
        run: |
          $params = @{}
          if ('${{ inputs.changed-files-only }}' -eq 'true') {
            $params['ChangedFilesOnly'] = $true
          }
          scripts/linting/Invoke-TerraformValidation.ps1 @params

      - name: Upload Terraform results
        if: always()
        continue-on-error: ${{ job.status == 'failure' || steps.validate.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-validation-results
          path: logs/terraform-validation-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: terraform-validation
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["validate"]'
          reports: '[{"path":"logs/terraform-validation-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
