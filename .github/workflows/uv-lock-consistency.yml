name: uv Lock Consistency

on:
  workflow_call:
    inputs:
      changed-files-only:
        description: 'Only check projects whose uv.lock or pyproject.toml changed'
        required: false
        type: boolean
        default: false
      soft-fail:
        description: 'Prevent PR failures when lock drift is detected'
        required: false
        type: boolean
        default: false
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.uv-lock-consistency.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.uv-lock-consistency.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.uv-lock-consistency.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.uv-lock-consistency.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.uv-lock-consistency.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.uv-lock-consistency.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.uv-lock-consistency.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.uv-lock-consistency.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  uv-lock-consistency:
    name: Check uv Lock Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup root Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.8'

      - name: Create logs directory
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Run uv Lock Consistency Check
        id: locks
        env:
          CHANGED_FILES_ONLY: ${{ inputs.changed-files-only }}
        run: |
          $params = @{}
          if ($env:CHANGED_FILES_ONLY -eq 'true') {
            $params['ChangedFilesOnly'] = $true
          }
          & scripts/linting/Invoke-UvLockConsistencyCheck.ps1 @params
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Validate lock consistency report
        id: report
        if: ${{ steps.locks.outcome == 'success' }}
        env:
          CHANGED_FILES_ONLY: ${{ inputs.changed-files-only }}
        run: |
          $path = 'logs/uv-lock-consistency-results.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Lock consistency report is missing: $path"
          }
          $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if (-not $report.check_passed -or ($env:CHANGED_FILES_ONLY -ne 'true' -and $report.projects_count -lt 1)) {
            throw "Lock consistency report has no successful selected work"
          }

      - name: Upload lock consistency results
        id: upload
        if: always()
        continue-on-error: ${{ steps.locks.outcome != 'success' || steps.report.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-lock-consistency-results
          path: logs/uv-lock-consistency-results.json
          retention-days: 30

      - name: Upload job summary
        if: always()
        continue-on-error: ${{ steps.locks.outcome != 'success' || steps.report.outcome == 'failure' || steps.upload.outcome == 'failure' }}
        run: |
          if (Test-Path logs/uv-lock-consistency-summary.md) {
            Get-Content logs/uv-lock-consistency-summary.md >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: uv-lock-consistency
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["locks"]'
          reports: '[{"path":"logs/uv-lock-consistency-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
