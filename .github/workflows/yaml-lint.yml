name: YAML Lint

on:
  workflow_call:
    inputs:
      soft-fail:
        description: 'Whether to continue on actionlint violations'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only lint changed workflow files'
        required: false
        type: boolean
        default: true
    outputs:
      work-status: {description: Execution status, value: '${{ jobs.yaml-lint.outputs.work-status }}'}
      expected-count: {description: Expected operations, value: '${{ jobs.yaml-lint.outputs.expected-count }}'}
      executed-count: {description: Executed operations, value: '${{ jobs.yaml-lint.outputs.executed-count }}'}
      artifact-id: {description: Evidence artifact ID, value: '${{ jobs.yaml-lint.outputs.artifact-id }}'}
      artifact-url: {description: Evidence artifact URL, value: '${{ jobs.yaml-lint.outputs.artifact-url }}'}
      test-count: {description: Executed tests, value: '${{ jobs.yaml-lint.outputs.test-count }}'}
      skipped-count: {description: Skipped operations, value: '${{ jobs.yaml-lint.outputs.skipped-count }}'}
      first-failure: {description: First failed operation, value: '${{ jobs.yaml-lint.outputs.first-failure }}'}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  yaml-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      work-status: ${{ steps.outcome.outputs.work-status }}
      expected-count: ${{ steps.outcome.outputs.expected-count }}
      executed-count: ${{ steps.outcome.outputs.executed-count }}
      artifact-id: ${{ steps.outcome.outputs.artifact-id }}
      artifact-url: ${{ steps.outcome.outputs.artifact-url }}
      test-count: ${{ steps.outcome.outputs.test-count }}
      skipped-count: ${{ steps.outcome.outputs.skipped-count }}
      first-failure: ${{ steps.outcome.outputs.first-failure }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create logs directory
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Install actionlint
        run: |
          $version = '1.7.10'
          $expectedHash = 'f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f'
          $url = "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          $tmpFile = Join-Path $env:GITHUB_WORKSPACE 'actionlint.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $tmpFile
          $actualHash = (Get-FileHash -Path $tmpFile -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "Hash mismatch: expected $expectedHash, got $actualHash"
          }
          sudo tar -xzf $tmpFile -C /usr/local/bin actionlint
          Remove-Item $tmpFile
          actionlint --version

      - name: Run YAML Lint
        id: lint
        continue-on-error: ${{ inputs.soft-fail }}
        run: |
          $lintArgs = @{}
          if ('${{ inputs.changed-files-only }}' -eq 'true') {
            $lintArgs['ChangedFilesOnly'] = $true
          }
          & scripts/linting/Invoke-YamlLint.ps1 @lintArgs

      - name: Upload YAML lint results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaml-lint-results
          path: logs/
          retention-days: 30

      - name: Publish execution evidence
        id: outcome
        if: always()
        uses: ./.github/actions/ci-outcome
        with:
          workflow: yaml-lint
          steps-json: ${{ toJSON(steps) }}
          required-steps: '["lint"]'
          reports: '[{"path":"logs/yaml-lint-results.json","kind":"json"}]'
          fail-on-error: ${{ !inputs.soft-fail }}
