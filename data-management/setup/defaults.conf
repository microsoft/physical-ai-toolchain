# Default configuration for data-management setup deployment scripts
# Override via command-line arguments or environment variables

# Default Terraform Directory (relative to data-management/setup)
DEFAULT_TF_DIR="${DEFAULT_TF_DIR:-../../infrastructure/terraform}"

# Dataviewer Container Images
DATAVIEWER_BACKEND_IMAGE="${DATAVIEWER_BACKEND_IMAGE:-dataviewer-backend}"
DATAVIEWER_FRONTEND_IMAGE="${DATAVIEWER_FRONTEND_IMAGE:-dataviewer-frontend}"
DATAVIEWER_IMAGE_TAG="${DATAVIEWER_IMAGE_TAG:-latest}"
# Target platform for --local-build (Container Apps run linux/amd64)
DATAVIEWER_BUILD_PLATFORM="${DATAVIEWER_BUILD_PLATFORM:-linux/amd64}"
# Backend extras for Container Apps images. The yolo extra adds CUDA torch and
# exceeds the Consumption profile's 8 GB image limit, so detection returns 503.
DATAVIEWER_BACKEND_EXTRAS="${DATAVIEWER_BACKEND_EXTRAS:-azure analysis export auth}"
