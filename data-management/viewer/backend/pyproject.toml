[project]
name = "lerobot-annotation-api"
version = "0.1.0"
description = "API for LeRobot episode annotation system"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "physical-ai-curation==0.1.0",
    "physical-ai-dataset-io==0.1.0",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.4",
    "slowapi==0.1.10",
    "aiofiles==25.1.0",
    "numpy==2.5.4",
    "pyarrow==25.0.1",
    "Pillow==13.0.0",
    "av==18.1.0",
    "cachetools==7.2.1",
]

[project.urls]
Repository = "https://github.com/microsoft/physical-ai-toolchain"

[project.optional-dependencies]
azure = [
    "aiohttp==3.14.4",
    "azure-storage-blob==12.31.0",
    "azure-identity==1.26.0",
]
analysis = [
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.5",
]
huggingface = [
    "huggingface-hub==1.33.0",
]
auth = [
    "pyjwt[crypto]==2.15.1",
]
hdf5 = [
    "h5py==3.16.0",
]
export = [
    "h5py==3.16.0",
]
yolo = [
    "ultralytics==8.4.174",
]
vlm-judge = [
    "physical-ai-vlm-judge[qwen3-vl]==0.1.0",
]

[dependency-groups]
dev = [
    "physical-ai-vlm-judge[openai]==0.1.0",
    "ruff==0.17.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "hypothesis==6.170.2",
    "schemathesis==4.29.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["T201"]
ignore = [
    "B008", # Depends() in function defaults is a FastAPI pattern
    "B905", # zip() without strict= is acceptable
    "B904", # Exception cause via constructor, not raise-from
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.uv.sources]
physical-ai-curation = { workspace = true }
physical-ai-dataset-io = { workspace = true }
physical-ai-vlm-judge = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["../../.."]
testpaths = ["tests", "../../curation/tests"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/**/conftest.py", "src/**/__init__.py"]

[tool.coverage.report]
show_missing = true
precision = 2
