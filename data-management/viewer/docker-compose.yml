services:
  backend:
    build:
      context: ../..
      dockerfile: data-management/viewer/backend/Dockerfile
      args:
        BACKEND_EXTRAS: "${BACKEND_EXTRAS:-azure,analysis,export,auth,yolo}"
        JUDGE_EXTRAS: "${JUDGE_EXTRAS:-}"
    restart: unless-stopped
    user: "${DATAVIEWER_UID:-999}:${DATAVIEWER_GID:-999}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      # Storage backend: local | azure
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"

      # Local storage (used when STORAGE_BACKEND=local)
      DATA_DIR: "/data"
      DETECTION_MODELS_DIR: "/models"
      DETECTION_MODEL_DIGESTS: "${DETECTION_MODEL_DIGESTS:-{}}"

      VLM_JUDGE_ENABLED: "${VLM_JUDGE_ENABLED:-false}"
      VLM_JUDGE_BACKEND: "${VLM_JUDGE_BACKEND:-echo}"
      VLM_JUDGE_MODEL_ID: "${VLM_JUDGE_MODEL_ID:-Qwen/Qwen3-VL-4B-Instruct}"
      VLM_JUDGE_MODEL_REVISION: "${VLM_JUDGE_MODEL_REVISION:-}"
      VLM_JUDGE_BASE_URL: "${VLM_JUDGE_BASE_URL:-}"
      VLM_JUDGE_API_KEY: "${VLM_JUDGE_API_KEY:-}"
      VLM_JUDGE_JOB_DIR: "/state/judge"
      VLM_JUDGE_CACHE_DIR: "/scratch/judge"
      VLM_JUDGE_CAPACITY: "${VLM_JUDGE_CAPACITY:-1}"
      VLM_JUDGE_CAPACITY_SCOPE: "${VLM_JUDGE_CAPACITY_SCOPE:-configured-inference-device}"
      VLM_JUDGE_N_FRAMES: "${VLM_JUDGE_N_FRAMES:-12}"
      VLM_JUDGE_PROCESS_METHOD: "${VLM_JUDGE_PROCESS_METHOD:-gvl}"
      HF_HOME: "/scratch/models"

      # Azure Blob Storage (required when STORAGE_BACKEND=azure)
      AZURE_STORAGE_ACCOUNT_NAME: "${AZURE_STORAGE_ACCOUNT_NAME:-}"
      AZURE_STORAGE_DATASET_CONTAINER: "${AZURE_STORAGE_DATASET_CONTAINER:-}"
      AZURE_STORAGE_ANNOTATION_CONTAINER: "${AZURE_STORAGE_ANNOTATION_CONTAINER:-}"
      # Leave AZURE_STORAGE_SAS_TOKEN unset to use DefaultAzureCredential (MSI)
      AZURE_STORAGE_SAS_TOKEN: "${AZURE_STORAGE_SAS_TOKEN:-}"

      # CORS: allow requests from the frontend container
      CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://frontend"

      # Authentication
      DATAVIEWER_AUTH_DISABLED: "${DATAVIEWER_AUTH_DISABLED:-true}"
    volumes:
      # Local storage persists annotations and labels beside each dataset
      - "${DATAVIEWER_HOST_DATA_DIR:-./datasets}:/data:${DATAVIEWER_DATA_MOUNT_OPTIONS:-rw}"
      # Mount reviewed detection weights as immutable runtime inputs
      - "${DATAVIEWER_HOST_MODELS_DIR:-./models}:/models:ro"
      - "judge-state:/state"
    tmpfs:
      - "/scratch:uid=${DATAVIEWER_UID:-999},gid=${DATAVIEWER_GID:-999}"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 3s

  frontend:
    build:
      context: ../..
      dockerfile: data-management/viewer/frontend/Dockerfile
      args:
        VITE_AZURE_CLIENT_ID: "${VITE_AZURE_CLIENT_ID:-}"
        VITE_AZURE_TENANT_ID: "${VITE_AZURE_TENANT_ID:-}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    environment:
      NGINX_BACKEND_HOST: "backend:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  judge-state:
