[project]
name = "dataviewer-release-worker"
version = "0.1.0"
description = "Isolated LeRobot dataset release runtime"
requires-python = ">=3.12"
dependencies = [
    "av==15.0.0",
    "datasets==5.0.1",
    "jsonlines==4.0.0",
    "lerobot[av-dep]==0.6.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "setuptools==83.0.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[project.scripts]
release-worker = "release_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_worker"]

[tool.ruff]
extend = "../../../pyproject.toml"

[tool.uv]
environments = ["sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]
override-dependencies = [
    "datasets==5.0.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "setuptools==83.0.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
