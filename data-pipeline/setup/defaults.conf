# Default configuration for data-pipeline setup deployment scripts
# Override via command-line arguments or environment variables
# cspell:ignore inotify nofile

# Default Terraform Directory (relative to data-pipeline/setup)
DEFAULT_TF_DIR="${DEFAULT_TF_DIR:-../../infrastructure/terraform}"

# Ubuntu edge and K3s configuration
EDGE_STATE_DIR="${EDGE_STATE_DIR:-/var/lib/physical-ai-toolchain}"
EDGE_K3S_VERSION="${EDGE_K3S_VERSION:-v1.35.9+k3s1}"
EDGE_K3S_SHA256_AMD64="${EDGE_K3S_SHA256_AMD64:-897acb21cca57d477a211102251a6591450ce767344a9faaa121a1007ca9fa9a}"
EDGE_K3S_SHA256_ARM64="${EDGE_K3S_SHA256_ARM64:-6176dd12c512e177af998e6035920f6283c5fdbd5adfdff85c103a7fdf2a00b5}"
# Kubernetes upgrades cannot skip minor versions. An in-place upgrade passes through one pinned
# release per intermediate minor before EDGE_K3S_VERSION. Entries are version|amd64-sha256|arm64-sha256
# from the release's sha256sum-<arch>.txt files.
EDGE_K3S_UPGRADE_STEPS="${EDGE_K3S_UPGRADE_STEPS:-v1.33.13+k3s2|1572f0f23bd5a844bd405b71875877aacacc7ab79e279d3d73735654c37c7735|cf6afb3944f9ecf120fa2837b542479018c08f9ea1d1d181d4a68445e7717a8d v1.34.12+k3s1|ef1df26b26276c0f6d962391c94e12f9362d1f1e30ec7a7926e9ddb84b0d66ce|67e3e242ba23480634caecc18939feff3a558756b340e4ef964552d748b0271e}"
EDGE_K3S_POD_CIDR="${EDGE_K3S_POD_CIDR:-10.42.0.0/16}"
EDGE_K3S_SERVICE_CIDR="${EDGE_K3S_SERVICE_CIDR:-10.43.0.0/16}"
EDGE_K3S_DATA_DIR="${EDGE_K3S_DATA_DIR:-/var/lib/rancher/k3s}"
EDGE_K3S_CONTEXT="${EDGE_K3S_CONTEXT:-physical-ai-edge}"
EDGE_K3S_DEFAULT_RUNTIME="${EDGE_K3S_DEFAULT_RUNTIME:-}"
# After each K3s start, the installer waits up to this many seconds for kube-system Deployments and
# DaemonSets to roll out, checking at this interval; slow hosts or image pulls may need a longer timeout.
EDGE_K3S_WORKLOAD_TIMEOUT_SECONDS="${EDGE_K3S_WORKLOAD_TIMEOUT_SECONDS:-300}"
EDGE_K3S_WORKLOAD_INTERVAL_SECONDS="${EDGE_K3S_WORKLOAD_INTERVAL_SECONDS:-5}"
EDGE_MIN_MEMORY_MIB="${EDGE_MIN_MEMORY_MIB:-4096}"
EDGE_MIN_DISK_GIB="${EDGE_MIN_DISK_GIB:-20}"
EDGE_KUBELET_SWAP_BEHAVIOR="${EDGE_KUBELET_SWAP_BEHAVIOR:-NoSwap}"
EDGE_INOTIFY_MAX_USER_INSTANCES="${EDGE_INOTIFY_MAX_USER_INSTANCES:-8192}"
EDGE_INOTIFY_MAX_USER_WATCHES="${EDGE_INOTIFY_MAX_USER_WATCHES:-524288}"
EDGE_FILE_MAX="${EDGE_FILE_MAX:-100000}"
EDGE_K3S_NOFILE_LIMIT="${EDGE_K3S_NOFILE_LIMIT:-1048576}"

# Ubuntu edge prerequisite tools
EDGE_HELM_VERSION="${EDGE_HELM_VERSION:-4.2.3}"
EDGE_HELM_SHA256_AMD64="${EDGE_HELM_SHA256_AMD64:-e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c}"
EDGE_HELM_SHA256_ARM64="${EDGE_HELM_SHA256_ARM64:-21abd9354d39b2cd79a8d76be6912cd137a983cbf997193503fb8a6a6e2f2785}"
EDGE_KUBELOGIN_VERSION="${EDGE_KUBELOGIN_VERSION:-0.2.19}"
EDGE_KUBELOGIN_SHA256_AMD64="${EDGE_KUBELOGIN_SHA256_AMD64:-ebaeff02aa899c5cae6a2b954b64fc02738185319df2570f7dc053451efa4b2f}"
EDGE_KUBELOGIN_SHA256_ARM64="${EDGE_KUBELOGIN_SHA256_ARM64:-aad7e7ca2a8e67db15b110e535123c1bc0f31ef488f5d3ab5b9ae7c9de6f48d3}"
EDGE_OSMO_VERSION="${EDGE_OSMO_VERSION:-6.3.1}"
EDGE_OSMO_SHA256_AMD64="${EDGE_OSMO_SHA256_AMD64:-21d9622634ee3f854c90682ca93f618e624603c22be646338199a0a01f94dd6f}"
EDGE_OSMO_SHA256_ARM64="${EDGE_OSMO_SHA256_ARM64:-ca3ffc0e31b0e6f67af2a5b4822552738d0429c7279e58d797640964b740ed0b}"
MICROSOFT_PACKAGES_KEY_FINGERPRINT="${MICROSOFT_PACKAGES_KEY_FINGERPRINT:-BC528686B50D79E339D3721CEB3E94ADBE1229CF}"

# Arc Namespace Configuration
EDGE_NAMESPACE="${EDGE_NAMESPACE:-data-pipeline}"

# ACSA Extension Configuration
ACSA_EXTENSION_NAME="${ACSA_EXTENSION_NAME:-azure-arc-containerstorage}"
ACSA_EXTENSION_VERSION="${ACSA_EXTENSION_VERSION:-2.11.2}"
ACSA_RELEASE_TRAIN="${ACSA_RELEASE_TRAIN:-stable}"
ACSA_DISK_STORAGE_CLASS="${ACSA_DISK_STORAGE_CLASS:-default,local-path}"

# ACSA Volume Configuration
ACSA_STORAGE_CLASS="${ACSA_STORAGE_CLASS:-cloud-backed-sc}"
ACSA_PVC_NAME="${ACSA_PVC_NAME:-recording-data}"
ACSA_PVC_SIZE="${ACSA_PVC_SIZE:-50Gi}"

# Blob Sync Configuration
BLOB_CONTAINER_NAME="${BLOB_CONTAINER_NAME:-datasets}"
SUBVOLUME_NAME="${SUBVOLUME_NAME:-recordings}"
SUBVOLUME_PATH="${SUBVOLUME_PATH:-recordings}"

# IngestSubvolume synchronization behavior
ACSA_INGEST_ORDER="${ACSA_INGEST_ORDER:-oldest-first}"
ACSA_INGEST_MIN_DELAY_SEC="${ACSA_INGEST_MIN_DELAY_SEC:-30}"
ACSA_EVICTION_ORDER="${ACSA_EVICTION_ORDER:-unordered}"
ACSA_EVICTION_MIN_DELAY_SEC="${ACSA_EVICTION_MIN_DELAY_SEC:-600}"
ACSA_ON_DELETE="${ACSA_ON_DELETE:-trigger-immediate-ingest}"
