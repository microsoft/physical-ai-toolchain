[project]
name = "physical-ai-hil-policy-host"
version = "0.1.0"
description = "Tier 0 HiL target policy-host dependencies"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot==0.6.0",
    "numpy==2.2.6",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
