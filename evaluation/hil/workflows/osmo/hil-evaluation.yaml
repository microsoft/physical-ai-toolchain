workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      cpu: 1
      memory: 512Mi
      storage: 1Gi
      gpu: 0
      platform: hil_cpu
  timeout:
    exec_timeout: 10m
    queue_timeout: 10m
  tasks:
    - name: ur10e-no-command
      image: "{{ image }}"
      outputs:
        - url: "{{ output_uri }}"
      command: [sh]
      args:
        - -ceu
        - |
          mkdir -p /tmp/hil/config
          base64 -d /tmp/no_command_runner.py.b64 > /tmp/hil/no_command_runner.py
          base64 -d /tmp/ur10e-no-command.json.b64 > /tmp/hil/config/ur10e-no-command.json
          base64 -d /tmp/ur10e-observations.jsonl.b64 > /tmp/hil/config/ur10e-observations.jsonl
          python3 /tmp/hil/no_command_runner.py \
            --config /tmp/hil/config/ur10e-no-command.json \
            --output-dir "{{output}}" \
            --workflow-name "{{ workflow_name }}" \
            --backend-name "{{ backend_name }}" \
            --pool-name "{{ pool_name }}"
      files:
        - path: /tmp/no_command_runner.py.b64
          contents: "{{ runner_b64 }}"
        - path: /tmp/ur10e-no-command.json.b64
          contents: "{{ config_b64 }}"
        - path: /tmp/ur10e-observations.jsonl.b64
          contents: "{{ observations_b64 }}"

default-values:
  workflow_name: ur10e-no-command
  backend_name: hil-edge
  pool_name: hil-edge
  image: python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
  runner_b64: ""
  config_b64: ""
  observations_b64: ""
  output_uri: ""
