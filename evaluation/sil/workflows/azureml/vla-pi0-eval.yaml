# LeRobot pi0 Evaluation Job Template
#
# Structural Azure ML template for submit-azureml-vla-pi0-eval.sh. The submit
# script overrides source, dataset, compute, environment, and runtime values.

$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: LeRobot pi0 Evaluation
description: LeRobot pi0-family replay evaluation with VLA schema v1 artifacts.
experiment_name: vla-pi0-evaluation
identity:
  type: managed_identity

code: ../../../..
environment: azureml:lerobot-inference-env:2.13.0-cuda13.0-cudnn9-runtime-sha256-db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407
compute: azureml:cpu-inference

command: >-
  bash evaluation/sil/workflows/azureml/lerobot-eval-entry.sh

inputs:
  policy_repo_id: none
  policy_revision: none
  policy_type: pi0
  dataset_repo_id: none
  dataset_revision: none
  job_name: vla-pi0-eval
  output_dir: /workspace/outputs/eval
  eval_episodes: "10"
  eval_batch_size: "10"
  lerobot_version: none
  lerobot_project: training/vla/lerobot
  record_video: "false"
  mlflow_enable: "false"
  experiment_name: none
  register_model: none
  aml_model_name: none
  aml_model_version: none
  blob_storage_account: none
  blob_storage_container: datasets
  blob_prefix: none
  subscription_id: placeholder
  resource_group: placeholder
  workspace_name: placeholder
  mlflow_token_refresh_retries: "5"
  mlflow_http_request_timeout: "600"

outputs:
  eval_results:
    type: uri_folder
    mode: upload
