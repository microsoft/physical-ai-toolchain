workflow:
  name: isaaclab-inference
  timeout:
    exec_timeout: 2h
  resources:
    default:
      gpu: {{ gpu }}
      cpu: {{ cpu }}
      memory: {{ memory }}
      storage: {{ storage }}
      platform: "{{ platform }}"
  tasks:
    - name: isaac-inference
      image: "{{ image }}"
      command: ["bash", "-euc"]
      args:
        - |
          base64 -d /tmp/entry.sh.b64 > /tmp/entry.sh
          [ -s /tmp/entry.sh ] || { echo "ERROR: /tmp/entry.sh is empty — submit via evaluation/sil/scripts/submit-osmo-eval.sh" >&2; exit 1; }
          exec bash /tmp/entry.sh
      inputs:
        - url: "{{ code_url }}"
          regex: ".*"
      environment:
        NVIDIA_DRIVER_CAPABILITIES: "all"
        TASK: "{{ task }}"
        NUM_ENVS: "{{ num_envs }}"
        MAX_STEPS: "{{ max_steps }}"
        VIDEO_LENGTH: "{{ video_length }}"
        ACCEPT_EULA: "Y"
        PRIVACY_CONSENT: "Y"
        PAYLOAD_ROOT: "{{ payload_root }}"
        OSMO_INPUT_0: "{{input:0}}"
        CHECKPOINT_URI: "{{ checkpoint_uri }}"
        INFERENCE_FORMAT: "{{ inference_format }}"
        FRAMEWORK: "{{ framework }}"
        EVAL_EPISODES: "{{ eval_episodes }}"
        SUCCESS_THRESHOLD: "{{ success_threshold }}"
        OUTPUT_DIR: "{{output}}"
        EXPERIMENT_NAME: "{{ experiment_name }}"
        AZURE_SUBSCRIPTION_ID: "{{ azure_subscription_id }}"
        AZURE_RESOURCE_GROUP: "{{ azure_resource_group }}"
        AZUREML_WORKSPACE_NAME: "{{ azure_workspace_name }}"
        AZURE_STORAGE_ACCOUNT_NAME: "{{ azure_storage_account_name }}"
        AZURE_STORAGE_CONTAINER_NAME: "{{ azure_storage_container_name }}"
        AZURE_AUTHORITY_HOST: "{{ azure_authority_host }}"
        TRACKING_BACKEND: "{{ tracking_backend }}"
        MLFLOW_TRACKING_URI: "{{ mlflow_tracking_uri }}"
        PYTHON: "{{ python }}"
      files:
        - path: /tmp/entry.sh.b64
          contents: "{{entry_script_b64}}"
{% if output_dataset %}
      # Videos and metrics as an OSMO dataset version, for example as VLM judge input.
      outputs:
        - dataset:
            name: "{{ dataset_bucket }}/{{ output_dataset }}"
{% endif %}

default-values:
  # Submission scripts set image from scripts/lib/common.sh via --set-string.
  # This value is the direct-workflow fallback; keep it in sync with DEFAULT_ISAAC_LAB_IMAGE.
  image: nvcr.io/nvidia/isaac-lab:3.0.0-beta2-post1@sha256:ae9c938a16df856effad6dab92115ee0dce2a8813f56847eeeccbebc008d02c4
  task: Isaac-Ant-v0
  num_envs: "4"
  max_steps: "500"
  video_length: "200"
  code_url: ""
  entry_script_b64: ""
  payload_root: /tmp/isaac_payload
  checkpoint_uri: ""
  inference_format: "both"
  framework: skrl
  eval_episodes: "100"
  success_threshold: "-1"
  output_dataset: ""
  dataset_bucket: training
  # Empty keeps the inference-<task> experiment.
  experiment_name: ""
  azure_subscription_id: ""
  azure_resource_group: ""
  azure_workspace_name: ""
  azure_storage_account_name: ""
  azure_storage_container_name: "isaaclab-training-logs"
  azure_authority_host: https://login.microsoftonline.com
  tracking_backend: azureml
  mlflow_tracking_uri: ""
  gpu: "1"
  cpu: "20"
  memory: 180Gi
  storage: 100Gi
  platform: gpu_platform
  python: "/workspace/isaaclab/isaaclab.sh -p"
