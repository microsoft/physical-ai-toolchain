[project]
name = "physical-ai-vlm-judge"
version = "0.1.0"
description = "VLM-as-judge harness for robot manipulation episodes"
requires-python = ">=3.12"
dependencies = [
    "av==18.1.0",
    "pandas==3.0.5",
    "Pillow==12.3.0",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
api = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.4",
]
openai = [
    "openai==3.3.1",
]
qwen3-vl = [
    "accelerate==1.14.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.15.1",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evaluation.vlm_judge"]
package-dir = { "evaluation.vlm_judge" = "." }

[tool.uv]
prerelease = "allow"
environments = [
    "sys_platform != 'linux'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
