[project]
name = "physical-ai-vlm-judge"
version = "0.1.0"
description = "VLM-as-judge harness for robot manipulation episodes"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "physical-ai-dataset-io==0.1.0",
    "av==18.1.0",
    "pandas==3.0.5",
    "Pillow==13.0.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
]

[project.urls]
Repository = "https://github.com/microsoft/physical-ai-toolchain"

[project.optional-dependencies]
api = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
]
openai = [
    "azure-identity==1.26.0",
    "openai==3.6.0",
]
qwen3-vl = [
    "accelerate==1.15.0",
    # Prevent prerelease resolution from selecting hf-xet 1.6.1a0.
    "hf-xet==1.6.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evaluation.vlm_judge"]
package-dir = { "evaluation.vlm_judge" = "." }

[tool.pytest.ini_options]
testpaths = ["../tests/vlm_judge"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=evaluation.vlm_judge",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:evaluation/logs/coverage-vlm-judge.xml",
    "--cov-fail-under=35",
    "--junitxml=evaluation/logs/pytest-vlm-judge-results.xml",
]
