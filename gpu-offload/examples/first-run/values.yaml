image:
  registry: ""
  repository: gpu-offload-first-run
  tag: local
  digest: ""
  pullPolicy: Never

imagePullSecrets: []

serverStage:
  name: cpu
  # Server-stage image. Leave the repository empty to reuse the client image.
  # The GPU check uses a separate torch-CUDA image so the client stays slim and
  # genuinely has no GPU support of its own.
  image:
    repository: ""
    tag: ""
  gpu:
    enabled: false
    # wsl-nvidia reaches the GPU through /dev/dxg and the mounted Windows driver
    # tree; baremetal-nvidia uses the standard NVIDIA container stack.
    platform: baremetal-nvidia
    resourceName: nvidia.com/gpu
    quantity: "1"
    driverLibraryPath: /usr/lib/wsl/lib
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

clientResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
