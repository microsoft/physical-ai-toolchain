{{- if .Values.offload.enabled }}
{{- $configMapName := default (printf "%s-offload" (include "lerobot-rollout.fullname" .)) .Values.offload.configMapName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName }}
  labels:
    {{- include "lerobot-rollout.labels" . | nindent 4 }}
    app.kubernetes.io/component: offload-config
data:
  remote.yaml: |
    encryption: {{ .Values.offload.encryption }}
    serverstages:
      - name: {{ .Values.offload.stageName | quote }}
        perclient: true
        serverreplicas: {{ .Values.offload.server.replicas }}
        {{- with .Values.offload.server.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.offload.server.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    remoteclasses:
      - {{ .Values.offload.remoteClass | quote }}:
          remoteloc: {{ .Values.offload.stageName | quote }}
      {{- if or .Values.offload.rawObservation.enabled .Values.benchmark.enabled }}
      - {{ .Values.offload.rawObservation.remoteClass | quote }}:
          remoteloc: {{ .Values.offload.stageName | quote }}
          remoteableserver: true
          noremotefuncs:
            - notify_observation
      {{- end }}
    remotefuncs:
      - {{ ternary .Values.offload.benchmarkLoadFunction .Values.offload.loadFunction .Values.benchmark.enabled | quote }}:
          singleinstance: true
          remoteloc: {{ .Values.offload.stageName | quote }}
{{- end }}
