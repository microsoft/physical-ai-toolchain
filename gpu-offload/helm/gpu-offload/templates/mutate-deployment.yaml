# SPDX-License-Identifier: MIT
# Adapted from an upstream GPU-offloading reference implementation.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-offload.fullname" . }}-mutate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-offload.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-offload.fullname" . }}-mutate
  labels:
    {{- include "gpu-offload.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-offload.fullname" . }}-mutate
  labels:
    {{- include "gpu-offload.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-offload.fullname" . }}-mutate
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-offload.fullname" . }}-mutate
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-offload.fullname" . }}-mutate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-offload.labels" . | nindent 4 }}
    app.kubernetes.io/component: mutate
spec:
  ports:
    - name: webhook
      port: {{ .Values.mutate.webhookPort }}
      targetPort: webhook
  selector:
    {{- include "gpu-offload.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mutate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-offload.fullname" . }}-mutate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-offload.labels" . | nindent 4 }}
    app.kubernetes.io/component: mutate
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gpu-offload.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mutate
  template:
    metadata:
      labels:
        {{- include "gpu-offload.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mutate
    spec:
      serviceAccountName: {{ include "gpu-offload.fullname" . }}-mutate
      terminationGracePeriodSeconds: 0
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mutate
          image: {{ include "gpu-offload.image" (dict "registry" .Values.image.registry "image" .Values.mutate.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/python3
            - /app/mutate.py
            - --port
            - {{ .Values.mutate.webhookPort | quote }}
            - --cert-file
            - /certs/tls.crt
            - --key-file
            - /certs/tls.key
          ports:
            - name: webhook
              containerPort: {{ .Values.mutate.webhookPort }}
          securityContext:
            runAsNonRoot: {{ .Values.mutateSecurityContext.runAsNonRoot }}
            runAsUser: {{ .Values.mutateSecurityContext.runAsUser }}
            allowPrivilegeEscalation: {{ .Values.mutateSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.mutateSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml .Values.mutateSecurityContext.capabilities.drop | nindent 16 }}
          volumeMounts:
            - name: webhook-tls
              mountPath: /certs
              readOnly: true
          env:
            - name: PRINTLOGLEVEL
              value: {{ .Values.mutate.logLevel | quote }}
            - name: LOGLEVEL
              value: {{ .Values.mutate.logLevel | quote }}
            - name: ALLOWED_SERVER_HOST_PATHS
              value: {{ .Values.mutate.allowedHostPaths | toJson | quote }}
      {{- with .Values.mutateScheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mutateScheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mutateScheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: webhook-tls
          secret:
            secretName: {{ include "gpu-offload.mutate.tlsSecretName" . }}
