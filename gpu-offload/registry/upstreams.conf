# Registries the host caches on behalf of the cluster.
#
# One registry:2 container is started per row. registry:2 proxies exactly one
# upstream per container, so every row needs its own port. Ports are fixed here
# rather than allocated at run time so a cache keeps its blobs across restarts.
#
# Columns:
#   host          Registry hostname as it appears in an image reference
#   port          Loopback port the cache listens on
#   remote        Upstream URL the cache fetches from
#   username_env  Environment variable holding the username, "-" for anonymous
#   password_env  Environment variable holding the password, "-" for anonymous
#
# Values may reference environment variables. A row whose host still contains an
# empty expansion is skipped, which is how the Azure Container Registry row stays
# in this file without committing a registry name.
#
# Credentials are read from the environment at run time. Never put a secret, an
# account name, or any other environment-specific value in this file.

# host                                port  remote                                      username_env                   password_env
docker.io                             5001  https://registry-1.docker.io                GPU_OFFLOAD_DOCKERIO_USERNAME  GPU_OFFLOAD_DOCKERIO_PASSWORD
ghcr.io                               5002  https://ghcr.io                             GPU_OFFLOAD_GHCR_USERNAME      GPU_OFFLOAD_GHCR_PASSWORD
nvcr.io                               5003  https://nvcr.io                             GPU_OFFLOAD_NVCR_USERNAME      GPU_OFFLOAD_NVCR_PASSWORD
${GPU_OFFLOAD_ACR_NAME}.azurecr.io    5004  https://${GPU_OFFLOAD_ACR_NAME}.azurecr.io  GPU_OFFLOAD_ACR_USERNAME       GPU_OFFLOAD_ACR_PASSWORD
