[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xavier-remoter-runtime"
version = "0.1.0"
description = "Xavier remoter runtime with safe MessagePack wire codec"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "filelock==3.20.3",
    "flask==3.1.3",
    "kubernetes==35.0.0",
    "msgpack==1.2.2",
    "pyyaml==6.0.2",
    "requests==2.34.2",
    "termcolor==3.2.0",
    "watchfiles==1.1.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["remoter"]

[tool.ruff]
extend = "../../pyproject.toml"
