# Default configuration for the local OSMO profile on a single-node K3s host.
# Source after data-pipeline/setup/defaults.conf. Override any value through the environment.
# Keep discovered identifiers, home paths, and secrets out of this file; credentials are
# generated into Kubernetes Secrets at deploy time.

# Kubernetes target: the protected operator kubeconfig and context that
# data-pipeline/setup/hil/01-install-k3s.sh writes. Every script verifies that the target is a
# K3s cluster before changing it, so an ambient KUBECONFIG never redirects local deployment.
LOCAL_KUBECONFIG="${LOCAL_KUBECONFIG:-${HIL_KUBECONFIG:-${XDG_DATA_HOME:-$HOME/.local/share}/physical-ai-toolchain/hil/kubeconfig.yaml}}"
LOCAL_KUBE_CONTEXT="${LOCAL_KUBE_CONTEXT:-${EDGE_K3S_CONTEXT:-physical-ai-edge}}"

# Host data root, created by 00-prepare-host.sh and owned by the invoking user. Datasets are yours:
# the dataviewer reads and writes them and jobs mount them read-only. Caches are written by job
# containers and pruned in-cluster, so cleanup never needs sudo.
LOCAL_DATA_ROOT="${LOCAL_DATA_ROOT:-/srv/physical-ai-toolchain}"
LOCAL_DATASETS_DIR="${LOCAL_DATASETS_DIR:-$LOCAL_DATA_ROOT/datasets}"
LOCAL_CACHE_DIR="${LOCAL_CACHE_DIR:-$LOCAL_DATA_ROOT/cache}"

# Namespaces. OSMO keeps the cloud names so workflow ServiceAccount subjects match the Azure path.
LOCAL_PLATFORM_NAMESPACE="${LOCAL_PLATFORM_NAMESPACE:-local-platform}"
LOCAL_MLFLOW_NAMESPACE="${LOCAL_MLFLOW_NAMESPACE:-mlflow}"
LOCAL_DATAVIEWER_NAMESPACE="${LOCAL_DATAVIEWER_NAMESPACE:-dataviewer}"
LOCAL_OSMO_CONTROL_PLANE_NAMESPACE="${LOCAL_OSMO_CONTROL_PLANE_NAMESPACE:-osmo-control-plane}"
LOCAL_OSMO_OPERATOR_NAMESPACE="${LOCAL_OSMO_OPERATOR_NAMESPACE:-osmo-operator}"
LOCAL_OSMO_WORKFLOWS_NAMESPACE="${LOCAL_OSMO_WORKFLOWS_NAMESPACE:-osmo-workflows}"

# Pinned ClusterIPs inside the K3s service CIDR (EDGE_K3S_SERVICE_CIDR). This host reaches ClusterIPs
# directly, so one URL serves host CLIs and pods without opening ports on the network.
LOCAL_S3_CLUSTER_IP="${LOCAL_S3_CLUSTER_IP:-10.43.250.10}"
LOCAL_S3_PORT="${LOCAL_S3_PORT:-9000}"
LOCAL_OSMO_GATEWAY_CLUSTER_IP="${LOCAL_OSMO_GATEWAY_CLUSTER_IP:-10.43.250.20}"
LOCAL_MLFLOW_CLUSTER_IP="${LOCAL_MLFLOW_CLUSTER_IP:-10.43.250.30}"
LOCAL_MLFLOW_PORT="${LOCAL_MLFLOW_PORT:-5000}"
LOCAL_DATAVIEWER_CLUSTER_IP="${LOCAL_DATAVIEWER_CLUSTER_IP:-10.43.250.40}"

# Image registry on the host loopback; containerd pulls loopback registries over HTTP.
LOCAL_REGISTRY_HOST="${LOCAL_REGISTRY_HOST:-localhost:5000}"

# Object storage layout. OSMO workflow data, logs, apps, staged code, and datasets share one bucket
# under distinct prefixes; MLflow artifacts use their own bucket.
LOCAL_S3_REGION="${LOCAL_S3_REGION:-us-east-1}"
LOCAL_OSMO_BUCKET="${LOCAL_OSMO_BUCKET:-osmo}"
LOCAL_MLFLOW_BUCKET="${LOCAL_MLFLOW_BUCKET:-mlflow}"

# Platform services (01-deploy-platform-services.sh). Images are pinned by digest and refreshed by
# scripts/update-image-digests.sh; PostgreSQL uses the same pin as the AKS maintenance client.
LOCAL_POSTGRES_IMAGE="${LOCAL_POSTGRES_IMAGE:-postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}"
LOCAL_VALKEY_IMAGE="${LOCAL_VALKEY_IMAGE:-valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507}"
LOCAL_RUSTFS_IMAGE="${LOCAL_RUSTFS_IMAGE:-rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c}"
LOCAL_REGISTRY_IMAGE="${LOCAL_REGISTRY_IMAGE:-registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8}"
LOCAL_S3_CLIENT_IMAGE="${LOCAL_S3_CLIENT_IMAGE:-amazon/aws-cli:2.38.0@sha256:ed3233c28ad56d6a66e9e7623a495ab2d7eb08d425f8eea0fdbdfacb12de2ba8}"
LOCAL_UTILITY_IMAGE="${LOCAL_UTILITY_IMAGE:-busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}"

# Persistent volumes. local-path sizes are advisory; data lives under the K3s storage directory.
LOCAL_STORAGE_CLASS="${LOCAL_STORAGE_CLASS:-local-path}"
LOCAL_POSTGRES_STORAGE="${LOCAL_POSTGRES_STORAGE:-20Gi}"
LOCAL_REDIS_STORAGE="${LOCAL_REDIS_STORAGE:-2Gi}"
LOCAL_S3_STORAGE="${LOCAL_S3_STORAGE:-200Gi}"
LOCAL_REGISTRY_STORAGE="${LOCAL_REGISTRY_STORAGE:-200Gi}"

# Credentials live only in these Secrets in LOCAL_PLATFORM_NAMESPACE. They are generated once, kept
# across re-runs, and never printed. Each database is owned by a role with the same name.
LOCAL_POSTGRES_SECRET="${LOCAL_POSTGRES_SECRET:-postgres-credentials}"
LOCAL_REDIS_SECRET="${LOCAL_REDIS_SECRET:-redis-credentials}"
LOCAL_S3_SECRET="${LOCAL_S3_SECRET:-s3-credentials}"
LOCAL_OSMO_DATABASE="${LOCAL_OSMO_DATABASE:-osmo}"
LOCAL_MLFLOW_DATABASE="${LOCAL_MLFLOW_DATABASE:-mlflow}"

# Label on everything the local profile deploys; teardown selects resources by it.
LOCAL_PART_OF="${LOCAL_PART_OF:-physical-ai-local}"

# Rollout and Helm timeout, shared with infrastructure/setup/defaults.conf.
TIMEOUT_DEPLOY="${TIMEOUT_DEPLOY:-600s}"

# OSMO platform names match the workflow template defaults used in the cloud.
LOCAL_OSMO_POOL="${LOCAL_OSMO_POOL:-default}"
LOCAL_OSMO_GPU_PLATFORM="${LOCAL_OSMO_GPU_PLATFORM:-gpu_platform}"

# Per-task resource defaults sized for one RTX 4090 job at a time on a 32-CPU, 62 GB host.
LOCAL_TASK_CPU="${LOCAL_TASK_CPU:-12}"
LOCAL_TASK_MEMORY="${LOCAL_TASK_MEMORY:-40Gi}"
LOCAL_TASK_STORAGE="${LOCAL_TASK_STORAGE:-80Gi}"
LOCAL_TASK_GPU="${LOCAL_TASK_GPU:-1}"
LOCAL_TASK_SHM="${LOCAL_TASK_SHM:-16Gi}"

# Where every task in the local pool sees the host data root: datasets read-only, caches read-write.
# The pool template also points HF_HOME, UV_CACHE_DIR, and PIP_CACHE_DIR into the cache mount.
LOCAL_JOB_DATASETS_PATH="${LOCAL_JOB_DATASETS_PATH:-/mnt/datasets}"
LOCAL_JOB_CACHE_PATH="${LOCAL_JOB_CACHE_PATH:-/mnt/cache}"

# OSMO (02-deploy-osmo.sh). The storage Secret holds OSMO's S3 credential in the field names OSMO reads.
# The OSMO CLI keeps one login per config directory; connect-osmo-cli.sh logs this directory in to the
# local service and refuses to replace a login to another service unless asked.
LOCAL_OSMO_STORAGE_SECRET="${LOCAL_OSMO_STORAGE_SECRET:-osmo-storage-credential}"
LOCAL_OSMO_CONFIG_DIR="${LOCAL_OSMO_CONFIG_DIR:-${OSMO_CONFIG_FILE_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/osmo}}"
LOCAL_OSMO_USER="${LOCAL_OSMO_USER:-admin}"
# Client ID of the managed identity that OSMO workflow pods use for Azure through the Arc workload identity
# webhook, after enable-azure-access.sh federates it. Empty keeps workflow pods off Azure.
LOCAL_OSMO_AZURE_CLIENT_ID="${LOCAL_OSMO_AZURE_CLIENT_ID:-}"

# MLflow tracking server and model registry (03-deploy-mlflow.sh). The server matches the repo's
# mlflow-skinny client pin; its -full image already carries the PostgreSQL driver and boto3. Clients
# need only the tracking URI: the server proxies artifacts into the object store with its own credential.
LOCAL_MLFLOW_IMAGE="${LOCAL_MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.16.1-full@sha256:6af326440af64565c2ea5d1d28c9ee355f70a8d4af5b76e35938365e1ce2e428}"
LOCAL_MLFLOW_DATABASE_SECRET="${LOCAL_MLFLOW_DATABASE_SECRET:-mlflow-database}"
LOCAL_MLFLOW_STORAGE_SECRET="${LOCAL_MLFLOW_STORAGE_SECRET:-mlflow-object-store}"
LOCAL_MLFLOW_WORKERS="${LOCAL_MLFLOW_WORKERS:-2}"

# Dataviewer (04-deploy-dataviewer.sh). Images build from this repository into the local registry and deploy
# by digest. The backend omits the yolo extra, whose CUDA PyTorch makes the image about 10 GB; object
# detection then answers 503. The azure extra stays so the optional Azure Blob mode needs no rebuild.
LOCAL_DATAVIEWER_BACKEND_REPOSITORY="${LOCAL_DATAVIEWER_BACKEND_REPOSITORY:-physical-ai-local/dataviewer-backend}"
LOCAL_DATAVIEWER_FRONTEND_REPOSITORY="${LOCAL_DATAVIEWER_FRONTEND_REPOSITORY:-physical-ai-local/dataviewer-frontend}"
LOCAL_DATAVIEWER_BACKEND_EXTRAS="${LOCAL_DATAVIEWER_BACKEND_EXTRAS:-azure,analysis,export,auth}"
