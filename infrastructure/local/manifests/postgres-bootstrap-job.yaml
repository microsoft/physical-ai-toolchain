# Creates the OSMO and MLflow roles and databases, sets their passwords from the credentials Secret, and
# proves each role can log in. Safe to rerun: existing roles and databases are kept.
# Rendered by 01-deploy-platform-services.sh, which substitutes only LOCAL_ placeholders.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  namespace: ${LOCAL_PLATFORM_NAMESPACE}
  labels:
    app.kubernetes.io/name: postgres-bootstrap
    app.kubernetes.io/part-of: ${LOCAL_PART_OF}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bootstrap
        app.kubernetes.io/part-of: ${LOCAL_PART_OF}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ${LOCAL_POSTGRES_IMAGE}
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${LOCAL_POSTGRES_SECRET}
                  key: superuser-password
            - name: OSMO_DATABASE
              value: ${LOCAL_OSMO_DATABASE}
            - name: OSMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${LOCAL_POSTGRES_SECRET}
                  key: osmo-password
            - name: MLFLOW_DATABASE
              value: ${LOCAL_MLFLOW_DATABASE}
            - name: MLFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${LOCAL_POSTGRES_SECRET}
                  key: mlflow-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until pg_isready --quiet; do sleep 2; done
              # Passwords stay in the environment: psql reads them with \getenv, never from arguments.
              ensure_owner() {
                psql --no-psqlrc --quiet --set ON_ERROR_STOP=1 --set name="$1" --set password_env="$2" <<'SQL'
              \getenv password :password_env
              SELECT format('CREATE ROLE %I LOGIN', :'name')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'name') \gexec
              ALTER ROLE :"name" WITH LOGIN PASSWORD :'password';
              SELECT format('CREATE DATABASE %I OWNER %I', :'name', :'name')
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'name') \gexec
              SQL
              }
              ensure_owner "$OSMO_DATABASE" OSMO_PASSWORD
              ensure_owner "$MLFLOW_DATABASE" MLFLOW_PASSWORD
              PGPASSWORD="$OSMO_PASSWORD" psql --no-psqlrc -U "$OSMO_DATABASE" -d "$OSMO_DATABASE" -tAc 'SELECT current_user, current_database()'
              PGPASSWORD="$MLFLOW_PASSWORD" psql --no-psqlrc -U "$MLFLOW_DATABASE" -d "$MLFLOW_DATABASE" -tAc 'SELECT current_user, current_database()'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
