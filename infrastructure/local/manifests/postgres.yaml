# PostgreSQL for the local OSMO profile. OSMO and MLflow each own a database in this server.
# Rendered by 01-deploy-platform-services.sh, which substitutes only LOCAL_ placeholders.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ${LOCAL_PLATFORM_NAMESPACE}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ${LOCAL_PART_OF}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ${LOCAL_PLATFORM_NAMESPACE}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ${LOCAL_PART_OF}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ${LOCAL_PART_OF}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ${LOCAL_POSTGRES_IMAGE}
          env:
            # A subdirectory keeps initdb independent of the volume root's ownership and mode.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${LOCAL_POSTGRES_SECRET}
                  key: superuser-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--username=postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "--host=127.0.0.1", "--username=postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: ${LOCAL_PART_OF}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${LOCAL_STORAGE_CLASS}
        resources:
          requests:
            storage: ${LOCAL_POSTGRES_STORAGE}
