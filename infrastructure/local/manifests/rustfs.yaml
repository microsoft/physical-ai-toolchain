# RustFS S3-compatible object store behind the Service "s3" at the pinned ClusterIP, so the host and pods
# share one endpoint URL. Path-style addressing only.
# Rendered by 01-deploy-platform-services.sh, which substitutes only LOCAL_ placeholders.
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: ${LOCAL_PLATFORM_NAMESPACE}
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: ${LOCAL_PART_OF}
spec:
  type: ClusterIP
  clusterIP: ${LOCAL_S3_CLUSTER_IP}
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: ${LOCAL_S3_PORT}
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: ${LOCAL_PLATFORM_NAMESPACE}
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: ${LOCAL_PART_OF}
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/component: object-store
        app.kubernetes.io/part-of: ${LOCAL_PART_OF}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: ${LOCAL_RUSTFS_IMAGE}
          # Raising the open-file soft limit to the hard limit keeps RustFS's per-disk descriptor cache on.
          command: ["/bin/sh", "-c", "ulimit -n \"$(ulimit -Hn)\" && exec /entrypoint.sh rustfs"]
          env:
            - name: RUSTFS_ACCESS_KEY_FILE
              value: /run/secrets/s3/access-key-id
            - name: RUSTFS_SECRET_KEY_FILE
              value: /run/secrets/s3/secret-access-key
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_REGION
              value: ${LOCAL_S3_REGION}
            - name: RUSTFS_VOLUMES
              value: /data
            # Empty sends logs to stdout instead of files under /logs.
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ""
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: credentials
              mountPath: /run/secrets/s3
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: ${LOCAL_S3_SECRET}
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rustfs
          app.kubernetes.io/part-of: ${LOCAL_PART_OF}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${LOCAL_STORAGE_CLASS}
        resources:
          requests:
            storage: ${LOCAL_S3_STORAGE}
