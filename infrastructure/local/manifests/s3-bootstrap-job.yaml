# Creates the object-store buckets the local profile uses. Safe to rerun: existing buckets are kept.
# Rendered by 01-deploy-platform-services.sh, which substitutes only LOCAL_ placeholders.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-bootstrap
  namespace: ${LOCAL_PLATFORM_NAMESPACE}
  labels:
    app.kubernetes.io/name: s3-bootstrap
    app.kubernetes.io/part-of: ${LOCAL_PART_OF}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-bootstrap
        app.kubernetes.io/part-of: ${LOCAL_PART_OF}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ${LOCAL_S3_CLIENT_IMAGE}
          env:
            - name: HOME
              value: /tmp
            - name: AWS_ENDPOINT_URL
              value: http://${LOCAL_S3_CLUSTER_IP}:${LOCAL_S3_PORT}
            - name: AWS_DEFAULT_REGION
              value: ${LOCAL_S3_REGION}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ${LOCAL_S3_SECRET}
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ${LOCAL_S3_SECRET}
                  key: secret-access-key
            - name: BUCKETS
              value: ${LOCAL_OSMO_BUCKET} ${LOCAL_MLFLOW_BUCKET}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              printf '[default]\ns3 =\n    addressing_style = path\n' > /tmp/aws-config
              export AWS_CONFIG_FILE=/tmp/aws-config
              for bucket in $BUCKETS; do
                if aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
                  echo "Bucket $bucket exists"
                else
                  aws s3api create-bucket --bucket "$bucket" >/dev/null
                  echo "Created bucket $bucket"
                fi
              done
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
