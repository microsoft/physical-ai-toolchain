# Negative smoke test, submitted by infrastructure/local/smoke-test-osmo.sh: the local pool allows no
# ad-hoc host mounts, so OSMO must reject this workflow at submission.
workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      cpu: 1
      memory: 128Mi
      storage: 128Mi
      platform: default
  tasks:
    - name: host-mount
      image: "{{ utility_image }}"
      command: [sh]
      args: [-c, "ls /host-etc"]
      volumeMounts:
        - /etc:/host-etc

default-values:
  workflow_name: local-osmo-mount-rejected
  utility_image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
