# SecretProviderClass for Azure Key Vault secrets sync via CSI driver
# Syncs osmo-admin-password from Key Vault. Used with --use-incluster-postgres.
# psql-admin-password is omitted; in-cluster PostgreSQL does not use a Key Vault secret.
#
# Deployed by: 03-deploy-osmo.sh (via common.sh apply_secret_provider_class)
# Creates: osmo-default-admin (password key)
#
# Secrets are created when pods mount the CSI volume (configured in osmo-control-plane-identity.yaml).
#
# Template variables (substituted by envsubst):
#   NAMESPACE, KEY_VAULT_NAME, OSMO_CLIENT_ID, TENANT_ID
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets
  namespace: ${NAMESPACE}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${OSMO_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: osmo-admin-password
          objectType: secret
  secretObjects:
    - secretName: osmo-default-admin
      type: Opaque
      data:
        - objectName: osmo-admin-password
          key: password
