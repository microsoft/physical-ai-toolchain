# Internal LoadBalancer for OSMO control plane access via NGINX ingress
# This service provides a stable internal IP for the backend operator to connect to OSMO.
#
# Deployed by: 03-deploy-osmo.sh
# Used by: backend operator (auto-detects this service's IP)
#
# The training-only AzureML extension retains its nginx ingress controller for OSMO.
# This dedicated internal LoadBalancer exposes that controller without enabling azureml-fe.
#
apiVersion: v1
kind: Service
metadata:
  name: azureml-ingress-nginx-internal-lb
  namespace: azureml
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "${OSMO_PRIVATE_SERVICE_IP}"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: azureml-ingress-nginx
    app.kubernetes.io/instance: azureml-ingress-nginx
    app.kubernetes.io/component: controller
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
