[project]
name = "physical-ai-curation"
version = "0.1.0"
description = "Shared curation models, saved inputs, and conditional storage"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["physical_ai_curation*"]
