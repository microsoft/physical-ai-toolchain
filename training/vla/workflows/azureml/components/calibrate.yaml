$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: vla_calibrate
display_name: VLA Calibration
version: "1"
description: Measure VLA CUDA memory through isolated one-step optimizer probes.

code: ../../../../..

inputs:
  prepared_dataset:
    type: uri_folder
    optional: true
    description: Prepared LeRobot dataset mounted read-only.
  adapter_name:
    type: string
  dataset_repo_id:
    type: string
  dataset_revision:
    type: string
  policy_type:
    type: string
  mixed_precision:
    type: string
    default: bf16
  policy_dtype:
    type: string
    default: none
  init_from_policy_hf_repo_id:
    type: string
  init_from_policy_hf_revision:
    type: string
  train_expert_only:
    type: string
  gradient_checkpointing:
    type: string
  use_imagenet_stats:
    type: string
  rename_map_b64:
    type: string
    default: none
  candidate_batch_sizes:
    type: string
    default: "1"
  headroom_fraction:
    type: number
    default: 0.1
  probe_timeout_seconds:
    type: integer
    default: 3600
  code_repository:
    type: string
  code_revision:
    type: string
  compute_target:
    type: string
  runtime_image:
    type: string
    default: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-runtime@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407

outputs:
  workload_contract:
    type: uri_folder
    mode: upload
    description: Generated immutable workload contract.
  calibration_report:
    type: uri_folder
    mode: upload
    description: Schema-versioned calibration report and workload fingerprint.

environment:
  image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-runtime@sha256:db80a41f8428644cebcb3d75b0b62df334ab6c0e75785951eb25f48bfbd42407

command: bash training/vla/scripts/azureml-component-entry.sh calibrate
