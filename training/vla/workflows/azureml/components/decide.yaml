$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: vla_decide_promotion
display_name: VLA Promotion Decision
version: "1"
description: Apply an immutable threshold policy to lineage-bound VLA evaluation evidence.

code: ../../../../..

inputs:
  candidate_manifest:
    type: uri_folder
    mode: download
  training_record:
    type: uri_folder
    mode: download
  evaluation:
    type: uri_folder
    mode: download
  promotion_policy:
    type: uri_file
    mode: download
  model_name:
    type: string

outputs:
  decision:
    type: uri_folder
    mode: upload
  policy:
    type: uri_folder
    mode: upload

environment:
  image: mcr.microsoft.com/azureml/openmpi5.0-ubuntu24.04:latest

command: >-
  python training/vla/scripts/decide_promotion.py
  --candidate-manifest ${{inputs.candidate_manifest}}
  --training-record ${{inputs.training_record}}
  --evaluation ${{inputs.evaluation}}
  --policy ${{inputs.promotion_policy}}
  --model-name ${{inputs.model_name}}
  --decision-output ${{outputs.decision}}
  --policy-output ${{outputs.policy}}
