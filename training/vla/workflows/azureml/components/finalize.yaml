$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: vla_finalize_candidate
display_name: VLA Candidate Finalization
version: "1"
description: Select and fingerprint one adapter-valid VLA policy candidate.

code: ../../../..

inputs:
  checkpoints:
    type: uri_folder
    mode: download
  training_record:
    type: uri_folder
    mode: download
  dataset_manifest:
    type: uri_folder
    mode: download
  adapter_name:
    type: string
  policy_type:
    type: string

outputs:
  candidate:
    type: uri_folder
    mode: upload
  candidate_manifest:
    type: uri_folder
    mode: upload

environment:
  image: mcr.microsoft.com/azureml/openmpi5.0-ubuntu24.04:latest

command: >-
  python vla/scripts/finalize_candidate.py
  --checkpoints ${{inputs.checkpoints}}
  --training-record ${{inputs.training_record}}
  --dataset-manifest ${{inputs.dataset_manifest}}
  --candidate-output ${{outputs.candidate}}
  --manifest-output ${{outputs.candidate_manifest}}
  --adapter-name ${{inputs.adapter_name}}
  --policy-type ${{inputs.policy_type}}
