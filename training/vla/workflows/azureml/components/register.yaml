$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: vla_guarded_register
display_name: VLA Guarded Registration
version: "1"
description: Register a finalized VLA candidate after authoritative evidence-job verification.

code: ../../../../..

inputs:
  candidate:
    type: uri_folder
    mode: ro_mount
  candidate_manifest:
    type: uri_folder
    mode: download
  evaluation:
    type: uri_folder
    mode: download
  policy:
    type: uri_folder
    mode: download
  decision:
    type: uri_folder
    mode: download
  model_name:
    type: string
  evidence_job:
    type: string
  producer_identity:
    type: string
  pipeline_contract_fingerprint:
    type: string
  code_revision:
    type: string
  subscription_id:
    type: string
  resource_group:
    type: string
  workspace_name:
    type: string

environment:
  image: mcr.microsoft.com/azureml/openmpi5.0-ubuntu24.04:latest

command: >-
  bash -c '
  set -euo pipefail;
  pip install --quiet --break-system-packages uv==0.7.12;
  uv python install 3.12;
  uv venv --python 3.12 /opt/vla-register-venv;
  source /opt/vla-register-venv/bin/activate;
  uv export --project workflows/azureml/scripts --frozen --no-hashes --no-emit-project
  | uv pip install --no-cache-dir --no-deps -r -;
  python training/vla/scripts/guarded_register.py
  --candidate ${{inputs.candidate}}
  --candidate-manifest ${{inputs.candidate_manifest}}
  --evaluation ${{inputs.evaluation}}
  --policy ${{inputs.policy}}
  --decision ${{inputs.decision}}
  --model-name ${{inputs.model_name}}
  --evidence-job ${{inputs.evidence_job}}
  --producer-identity ${{inputs.producer_identity}}
  --pipeline-contract-fingerprint ${{inputs.pipeline_contract_fingerprint}}
  --code-revision ${{inputs.code_revision}}
  --subscription-id ${{inputs.subscription_id}}
  --resource-group ${{inputs.resource_group}}
  --workspace-name ${{inputs.workspace_name}}'
