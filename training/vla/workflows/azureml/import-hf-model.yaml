# Hugging Face Model Import Pipeline
#
# Runs the reusable import component on a caller-selected Azure ML compute and
# persists its uri_folder output in workspaceblobstore.

$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: Import pinned Hugging Face model
experiment_name: vla-model-import
description: Download a revision-pinned Hugging Face model into an Azure ML datastore.

settings:
  default_datastore: azureml:workspaceblobstore
  continue_on_step_failure: false

inputs:
  repo_id: lerobot/pi05_base
  revision: b211f3d44c36b6acfcf7ae94a64e8e96f75a64ba
  compute: azureml:placeholder

outputs:
  model_snapshot:
    type: uri_folder
    mode: upload

jobs:
  import_model:
    type: command
    component: ./components/import-hf-model.yaml
    compute: ${{parent.inputs.compute}}
    inputs:
      repo_id: ${{parent.inputs.repo_id}}
      revision: ${{parent.inputs.revision}}
    outputs:
      model_snapshot: ${{parent.outputs.model_snapshot}}
    identity:
      type: managed_identity
    environment_variables:
      HF_TOKEN: placeholder

tags:
  pipeline: import-huggingface-model
  model_source: huggingface
