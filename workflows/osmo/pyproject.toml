[project]
name = "osmo-aml-mirror"
version = "0.1.0"
description = "AzureML replay mirror runtime dependencies for OSMO pods"
# Pinned to 3.11: the replay mirror installs into a fresh Python image on OSMO
# pods (replay-azureml.yaml). Versions resolve
# independently from training/rl/pyproject.toml.
requires-python = "==3.11.*"
dependencies = [
    "mlflow==3.15.2",
    "azureml-mlflow==1.62.0.post5",
    "azure-identity==1.25.3",
    "azure-ai-ml==1.34.1",
    "tbparse==0.0.9",
]

[tool.uv]
# OSMO pods run Linux; constrain universal resolution to a single-marker graph
# so the exported mirror matches the original linux-only `uv pip compile`
# (drops Windows-only pywin32/waitress and platform markers).
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    # azureml-mlflow caps cryptography below 49.0.0; 48.0.1 is the security
    # floor for GHSA-537c-gmf6-5ccf.
    "cryptography==50.0.1",
    # azureml-mlflow caps mlflow-skinny at 3.13.0; mirror mlflow's current pin.
    # The runtime installs this frozen resolution with --no-deps.
    "mlflow-skinny==3.15.2",
]
package = false
